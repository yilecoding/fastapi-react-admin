# electron-builder 配置。`pnpm --filter @admin/desktop package` 触发。
# ⚠️ 发自己的包前改成你自己的反向域名 —— macOS 靠它认应用身份，
#    Windows 靠它认「同一个应用的升级」。沿用别人的会和别人的安装冲突
# 🔴 这三个值一起决定「装出来叫什么」，而且**发版之后就不能再改**：
#   productName 同时是 `%APPDATA%\<它>\config.json` 的目录名（服务器地址、
#     打印机名、更新源都在里面）—— 改名 = 老机器上的配置成孤儿，
#     表现为「更新完之后又要重填一遍」，而不是一个报错；
#   appId 是 Windows 认「同一个应用的升级」的依据，改了会装出两份并存；
#   executableName 会出现在路径、任务管理器和脚本里，保持 ASCII 小写。
appId: io.github.yilecoding.admin-desktop
productName: Admin Desktop
# 不设的话 Linux 下可执行文件名会从包名推出来，变成 `@admindesktop`（实测）
executableName: admin-desktop
copyright: Copyright © ${author}

directories:
  output: release/${version}
  buildResources: build

# 默认名字是 `Admin Desktop Setup 0.0.1.exe` —— 带空格的文件名进 GitHub Release
# 下载链接会变成一串 `%20`，也不好写进部署脚本。显式压平：
artifactName: admin-desktop-${version}-setup.${ext}

# 只把主进程/preload 的产物和 package.json 打进 asar。
# 渲染层与原生助手都走 extraResources（见下），**故意放在 asar 外面**。
files:
  - dist/**
  - package.json

extraResources:
  # 渲染层 = apps/web 的构建产物。
  # 放 asar 外面有两个实打实的理由：
  #   1. `app://` 协议处理器用 net.fetch(file://…) 直接流式读盘，asar 里的路径 file:// 读不到；
  #   2. @file-viewer 的静态资产有 13MB，asar 里逐个 fs.readFile 再包 Response 纯属自找麻烦。
  - from: ../web/dist
    to: renderer
    filter: ["**/*"]
  # 原生助手程序（如身份证读卡器的 ReadCard.exe 及其厂商 DLL）。
  # ⚠️ 必须和它的 DLL 放在同一层目录 —— 助手启动时按工作目录去找同级的 DLL，
  #    目录结构一乱，现场表现就是「设备打不开」，而不是一个能看懂的报错。
  - from: resources
    to: native
    filter: ["**/*", "!.gitkeep"]

win:
  target:
    - target: nsis
      arch: [x64]
  # 生产环境务必配代码签名：不签名的话杀软首次扫描新 exe 的开销会落在用户的第一次操作上
  # （旧客户端实测：装完首次刷卡 20.4s，其中 17.9s 是杀软扫 ReadCard.exe）。
  # signtoolOptions:
  #   certificateFile: ...

# 交付目标是 Windows。下面这两段只为了让开发机（Mac / Linux）能跑
# `package:dir` 出一个能双击的产物做本地验证 —— 不要拿它们发布。
mac:
  target:
    - target: dir
  category: public.app-category.business
  # 自助终端不需要 Mac 版，所以不配签名与公证；真要发 Mac 版得补 notarize
linux:
  target:
    - target: dir

nsis:
  oneClick: false
  # 🔴 **per-user 安装（装进 %LOCALAPPDATA%\Programs），不是 per-machine。**
  #
  # 这一条是为**自动更新**选的：per-machine 装进 Program Files，每次更新都要 UAC 提权，
  # 而终端机的操作员通常不是管理员 —— 静默更新会卡在提权对话框上，
  # 而那台机器的窗口往往是无边框全屏的，对话框未必看得见。
  # VS Code 的 User Setup 走的就是这条路。
  #
  # ⚠️ 代价：**每个 Windows 账号各装一份**。单账号长期登录的终端机代价是零；
  # 多账号轮用的场景要回头重新评估。
  # ⚠️ 改这一项等于改安装位置，发版之后再改会留下两份并存 —— 趁没发出去定死。
  # ⚠️ 更阴的一条：机器上如果**还留着**早先 per-machine 装的那一份（同一个 appId），
  # 注册表 HKLM 的卸载项会让安装器仍然去更新旧位置 → 又要提权 → 静默更新失败。
  # 判据：卸载项里那条的 `UninstallString` 带 `/allusers`，先卸掉再装新包。
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ── 发布源 ──
#
# 这里配的是**打包时写进 `app-update.yml` 的那个源**，也就是 electron-updater
# 默认会去问的地方。CI 打 tag 出包时 `--publish always` 会把安装包 + `latest.yml`
# 一起传到 GitHub Release（默认建**草稿**，人工确认后再发布）。
#
# ⚠️ 交付给客户时通常不能用 GitHub：客户内网出不去。那时**不改这里**，
# 在客户机的 `userData/config.json` 里填 `updateUrl` 指向内网静态服务即可 ——
# `src/main/updater.ts` 优先用它，没填才回落到这份 app-update.yml。
# 一份包同时支持两种升级源，不用为内网单独打一版。
# ⚠️ 这一段**不是**用来上传的 —— CI 里跑的是 `--publish never`，产物由
# `.github/workflows/release.yml` 用 `gh release upload` 自己传。
# 理由：electron-builder 的 GitHub publisher 是每个产物一个上传任务、各自惰性建
# release，两个任务同时看到「release doesn't exist」就各建了一个草稿
# （草稿不按 tag 去重）—— 实测 v0.0.1-rc.1 当场劈成两个：一个只有 blockmap，
# 另一个有 exe + latest.yml，而那次运行还是「成功」。
# 留着这一段是为了让 electron-builder ① 生成 latest.yml ② 把 app-update.yml 打进包里。
publish:
  provider: github
  owner: yilecoding
  repo: fastapi-react-admin
  releaseType: draft

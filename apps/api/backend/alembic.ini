# Alembic 配置。
#
# ⚠️ 这个文件此前**只有 logging 段**，没有 `[alembic]` 主段 ——
# 跑任何 alembic 命令都是 `No 'script_location' key found in configuration`。
# 连接串不写在这里，由 `env.py` 从 `get_database_url()` 注入（口令不进版本库）。

[alembic]
# 相对 backend/ 目录（alembic 命令要在 backend/ 下跑）
script_location = alembic

# 迁移文件名：<时间戳>_<slug>.py。默认只有一串 hash，一屏文件名认不出谁是谁
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 让 env.py 能 `from backend...` —— alembic 在 backend/ 下跑，仓库根要在 sys.path 上
prepend_sys_path = ..

# ⚠️ 不写这一行，alembic 每次加载配置都打一条 DeprecationWarning：
# 「No path_separator found in configuration; falling back to legacy splitting
# on spaces, commas, and colons」。上面那个值只有一项、怎么切都一样，
# 所以这行现在只是**消掉警告**；但 legacy 切分是按空格/逗号/冒号切的 ——
# 哪天有人往 prepend_sys_path 里加第二个路径（或者路径里带空格），
# 它会静默切错。`os` = 用 os.pathsep（Linux 上是 `:`）
path_separator = os

# 迁移文件里的时间戳用本地时区。运维想的是「昨天」，不是「UTC 的昨天」
timezone = Asia/Shanghai

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

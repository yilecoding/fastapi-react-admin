# Alembic config.
#
# !! KEEP THIS FILE ASCII-ONLY (the rest of the repo comments in Chinese; this file cannot).
# alembic reads it with `encoding="locale"`, which ignores PYTHONUTF8: on a Windows box whose
# code page is not UTF-8 (e.g. zh-TW cp950) any non-ASCII byte here makes EVERY alembic command
# fail with UnicodeDecodeError -- `pnpm db:upgrade`, `pnpm test:db` included.
# Guard: app/task/tests/test_migrations.py::test_alembic_ini_is_ascii.
#
# This file used to have only the logging sections (no [alembic] section), so every command
# failed with "No 'script_location' key found in configuration".
# The connection URL is not here: env.py injects it from get_database_url() (no password in git).

[alembic]
# Relative to backend/ (run alembic commands from backend/)
script_location = alembic

# Migration file name: <timestamp>_<slug>.py. The default is a bare hash nobody can recognize
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Lets env.py `from backend...`: alembic runs in backend/, so the repo root must be on sys.path
prepend_sys_path = ..

# Without this line alembic prints a DeprecationWarning on every load ("No path_separator found
# in configuration; falling back to legacy splitting on spaces, commas, and colons"). With a
# single value it only silences the warning, but legacy splitting would silently mis-split the
# day someone adds a second path (or a path with spaces). `os` = os.pathsep
path_separator = os

# Timestamps in migration files use local time: ops think in "yesterday", not "UTC yesterday"
timezone = Asia/Shanghai

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

import:
  # Import templates, error reports and the instructions sheet (`common/dataio/importing.py` + `app/admin/service/import_service.py`).
  # Keys must match zh-CN one to one: templates and reports render in the current language
  cell_error: '{column}: {msg}'
  error_separator: '; '
  note:
    dept_code: Required. The department code (not its name), e.g. HQ
    dept_code_key: Required and globally unique; decides between create and update (2–32 characters, starts with an uppercase letter, uppercase letters, digits and underscores only)
    dept_name: Required when creating; must be unique among departments with the same parent. Leave blank when updating to keep the current name
    dict_label: Required. Unique within a dictionary type; type + label decides between create and update
    dict_type_code: Required. The dictionary type code (not its name)
    dict_value: Required when creating. Leave blank when updating to keep the current value
    email: Optional. Must be globally unique
    leader: Optional. The leader's username (not the nickname)
    nickname: Optional. Defaults to the username
    parent_code: Optional; leave blank for a top-level department. Can be an existing department or another row in the same file
    phone: Optional. 11-digit mobile number; format this column as text
    role_codes: Optional. Role codes separated by commas, e.g. MANAGER,STAFF
    update_keeps_blank: When updating existing data, a blank cell keeps the current value instead of clearing it
    user_default_password: Imported accounts all use the system default password. Ask each person to change it soon
    username: Required. Must be globally unique
  readme:
    column: Column
    data_sheet: Data
    invalid_hint: This value is not in the drop-down list. Use it anyway?
    note: Notes
    options: Allowed values
    required: Required
    sheet: Instructions
  report:
    errors: Errors
    file_name: '{resource} import errors_{stamp}.xlsx'
    row_no: Original row
    sheet: Errors
  template_name: '{resource} import template.xlsx'


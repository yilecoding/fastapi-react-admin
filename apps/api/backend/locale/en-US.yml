# ⚠️ 故意没有 `pydantic` 段（对比 zh-CN.yml 有 100 条）。
# pydantic-core 原生报错本身就是英文，`exception_handler.py` 里
# `if i18n.current_language != 'en-US':` 已经把英文请求短路掉了，
# 根本不会来查这张表。别看着 zh-CN.yml 有就照着补一份对称的过来。

response:
  error: Request error
  success: Request success
  server_error: Internal server error

success:
  login:
    oauth2_success: Login success (OAuth2)
    success: Login success

# `messages`/`message_templates`（按中文原文查表那一套）已经在这次治理里

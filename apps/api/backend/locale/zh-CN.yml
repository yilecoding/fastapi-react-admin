# ⚠️ 这一段是**反向**翻译：框架/上游抛出来的文案本身是英文
# （FastAPI 的 HTTPBearer → 'Not authenticated'、starlette 的 'Method Not Allowed'），
# 中文界面下它们才是需要被翻的那一方。
#
# `tm()` 的短路条件因此写成「默认语言 **且** 该语言没有 messages 表」——
# 只要这一段存在，zh-CN 也照常查表。业务代码里的中文原文查不到就原样返回，
# 所以这一段只会命中英文，不会误伤中文。
messages:
  Not authenticated: 未提供身份凭据
  Method Not Allowed: 不支持的请求方法
  Not Found: 请求的资源不存在
  Internal Server Error: 服务器内部错误

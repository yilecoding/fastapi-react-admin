[plugin]
summary = "参数配置"
version = "0.0.2"
description = "通常用于动态配置系统参数和前端工程数据展示"
author = "wu-clan"
tags = ["other"]
database = ["mysql", "postgresql", "sqlserver"]

[app]
extend = "admin"

[api.config]
prefix = "/configs"
tags = "系统参数配置"

[settings]
# 参数密钥的落库加密密钥，真值放环境变量 / .env（32 字节的十六进制字符串）。
# 生成：python -c "import secrets; print(secrets.token_hex(32))"
CONFIG_ENCRYPT_SECRET_KEY = ""

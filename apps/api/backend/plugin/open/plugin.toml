[plugin]
summary = "能力开放"
version = "0.0.2"
description = "给外部系统发 AK/SK，签名调用只读的开放接口（/api/open/v1）；调用全程留日志。Webhook 事件订阅：事件发生后签名 POST 给对方"
author = "yile"
tags = ["other"]
database = ["mysql", "postgresql", "sqlserver"]

[app]
# v1 = 管理接口（/api/v1/open-apps…，走后台 JWT + RBAC）；
# open_v1 = 开放接口（/api/open/v1/…，走 AK/SK 签名）。插件路由的前缀由各自的 APIRouter 定，
# 主路由不再加前缀，所以两组能挂在不同的根下
router = ["open_v1", "v1"]

[settings]
# 「最近调用时间」的写库节流：同一个应用这段时间内最多写一次（同步一跑就是一串翻页请求）
OPEN_LAST_USED_REDIS_PREFIX = "fba:open:last_used"
OPEN_NONCE_REDIS_PREFIX = "fba:open:nonce"
# 应用没单独设限流时的默认值（每分钟请求数，按应用计，不按 IP）
OPEN_RATE_PER_MINUTE = 120
# SK 落库的加密密钥（32 字节 = 64 位十六进制）。验签要重算签名，SK 必须能还原，所以是加密不是哈希。
# 🔴 留空则新建 / 重置密钥**拒绝**并明确报错 —— 不会静默存明文。真值放 .env。
# 生成：python -c "import os;print(os.urandom(32).hex())"
OPEN_SECRET_KEY = ""
# 时间戳与服务端时间允许相差的秒数；nonce 在 Redis 里存它的 2 倍，
# 保证窗口内重放一定撞上 nonce、窗口外重放一定撞上时间戳
OPEN_SIGN_WINDOW_SECONDS = 300

# ── Webhook 事件订阅（#167）──────────────────────────────────────────────
# 总闸：关掉后事件照记（审计），但不再生成投递。参数配置「Webhook」组可覆盖
OPEN_WEBHOOK_ENABLED = true
# 连续失败这么多次、且这一轮第一次失败已过去 24 小时 → 自动停用端点（只按次数会把对方夜里重启十分钟当成死端点）
OPEN_WEBHOOK_DISABLE_AFTER = 20
# 事件 / 投递 / 尝试记录保留天数（`maintenance.prune_logs` 一起删）
OPEN_WEBHOOK_RETENTION_DAYS = 30
OPEN_WEBHOOK_MAX_PER_APP = 10
# 规范建议 15–30 秒（飞书给接收方 3 秒、企微 5 秒；我们是发送方，宽一点）
OPEN_WEBHOOK_TIMEOUT_SECONDS = 15
# 照飞书事件订阅：15 秒 / 5 分钟 / 1 小时 / 6 小时，共 5 次尝试、约 7 小时
OPEN_WEBHOOK_RETRY_BACKOFF_SECONDS = "15,300,3600,21600"
OPEN_WEBHOOK_DELIVERY_BATCH = 50
OPEN_WEBHOOK_SENDING_STALE_SECONDS = 120
# 🔴 只给本地联调 / E2E：放行回环 / 私网地址和 http。生产保持 false
OPEN_WEBHOOK_ALLOW_PRIVATE_NETWORK = false

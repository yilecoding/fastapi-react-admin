[plugin]
summary = "审批流"
version = "0.0.1"
description = "飞书式审批：表单 + 树形流程 + 审批中心（issue #107）"
author = "yile"
tags = ["other"]
database = ["mysql", "postgresql", "sqlserver"]
# 抄送 / 催办 / 结果通知落在消息中心里（分类 WORKFLOW）
depends_on = ["notification"]

[app]
extend = "admin"

[api.workflow]
prefix = "/workflow"
tags = "审批流"

[settings]
# AI 自动同意的总闸（#111 第 5 条，见 plugin/workflow/AGENTS.md）。false = 所有流程的 AI 自动同意都停，
# 预审照常给建议。开着也只是「允许」：节点要自己开、这个流程 × 模型的数据够了才会真的替人同意
WORKFLOW_AI_APPROVE_ENABLED = true

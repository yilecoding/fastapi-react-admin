[plugin]
summary = "短信"
version = "0.0.1"
description = "短信 SDK（阿里云 / 腾讯云 / 控制台）+ 短信配置 + 发送频率防护 + 发送日志（issue #153）"
author = "yile"
tags = ["notification"]
database = ["mysql", "postgresql", "sqlserver"]

[app]
router = ["v1"]

[settings]
# 凭据 secret 的落库加密密钥（32 字节 = 64 位十六进制字符串）。独立于 AI_ENCRYPT_SECRET_KEY：两个插件可以单独装卸。
# 留空则「短信配置」拒绝保存带凭据的厂商并明确报错 —— 不会静默存明文。
# 生成：python -c "import os;print(os.urandom(32).hex())"，真值放 .env
SMS_ENCRYPT_SECRET_KEY = ""
# 全站每小时最多发多少条（防使用方写错循环把余额刷光），0 = 不限。触发时 log.error，调用方拿到 kind = circuit_open
SMS_GLOBAL_HOURLY_MAX = 500
# 「发送中」停留超过多少秒就在日志页显示成「结果未知」（进程在「插日志」和「更新终态」之间崩溃了）
SMS_SENDING_STALE_SECONDS = 180
SMS_REDIS_PREFIX = "fba:sms"

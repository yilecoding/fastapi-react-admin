map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 100MB = UPLOAD_ARCHIVE_SIZE_MAX。应用层的大小校验发生在 body **收完之后**
    # （见 backend/utils/file_ops.py: upload_file_verify 的注释），
    # 真正拦住超大请求只能在这一层。
    client_max_body_size 100m;
    client_body_buffer_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml
               font/woff font/woff2 application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 带 hash 的产物可以永久缓存；index.html 绝不能缓存 ——
    # 缓存住的话发版后旧壳子会去请求已经删掉的 chunk，白屏且难查
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    # 版本探针（构建时由 vite 发到 dist 根目录）。**必须 no-store** ——
    # 被缓存住的话前端永远比对到自己那个旧 buildId，「发新版了」这条提示
    # 就再也不会出现，而且看不出坏了（见 src/lib/app-version.ts）
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 文件下载别在 nginx 里攒着
        proxy_buffering off;
    }

    # 富文本正文里的内联图。后端把 PUBLIC_UPLOAD_DIR 挂在 /uploads，
    # 这棵子树**设计上就不鉴权** —— <img src> 带不上 Authorization 头。
    # 私有附件走 /api/v1/sys/files/{pk}/download，不在这里。
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # socket.io：后端 `app.mount('/ws', socket_app)` + `socketio_path='/ws/socket.io'`
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA history fallback —— 必须放在最后，否则会吃掉上面所有 location
    location / {
        try_files $uri $uri/ /index.html;
    }
}

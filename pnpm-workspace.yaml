packages:
  # Python 应用，只为了让 turbo 能一起起后端（唯一的 dev 脚本，无 JS 依赖）
  - "apps/api"
  # 同上：只有 dev 脚本，让 turbo dev 把 celery worker 也拉起来（见 apps/worker/README.md）
  - "apps/worker"
  - "apps/web"
  - "apps/desktop"
  # 移动端外壳（issue #39 的 B 路线）。注意它**没有 `dev` 脚本** ——
  # Expo 要占端口、要交互，不该跟着 `pnpm dev` 一起起，单独走 `pnpm mobile:dev`
  - "apps/mobile"
  # 公开文档站（Astro Starlight）。和 mobile 一样没有 `dev` 脚本，单独走 `pnpm docs:dev`
  - "apps/docs"
  - "packages/*"

allowBuilds:
  esbuild: true
  # electron 的 postinstall 负责下载 Electron 二进制，不放行就只剩 .d.ts，dev 与打包都跑不了
  electron: true
  # 只出 NSIS 安装包，用不到 Squirrel.Windows，它的构建脚本没必要跑
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@tanstack/react-router'
  - '@tanstack/router-core'
  - '@tanstack/router-generator'
  - '@tanstack/router-plugin'
  - i18next@26.4.0
  - babel-preset-expo@57.0.10

# 1.0 前的依赖审计（#193）：有漏洞的**间接**依赖抬到同一大版本里的修复版。
# 每条选择器都带下界（`>=大版本 <修复版`）—— 只写 `<修复版` 的话，将来哪个包要旧大版本也会被静默抬过去。
# 直接依赖是改 package.json 升的，不在这里。去掉某一条之前先跑 `pnpm audit --prod` 确认上游已经带上修复版。
overrides:
  prosemirror-view@>=1 <1.42.3: ^1.42.3            # 富文本粘贴 XSS（GHSA-c8x8-7fp4-3x9w），经 @tiptap/pm 带进来
  fast-uri@>=3 <3.1.6: ^3.1.6                      # 经 @hookform/resolvers → ajv，打进浏览器
  js-yaml@>=4 <4.3.2: ^4.3.2                       # 桌面端 electron-updater 解析更新清单
  shell-quote@>=1 <1.11.0: ^1.11.0                 # 移动端 react-native → react-devtools-core（开发期工具）
  undici@>=7 <7.30.1: ^7.30.1                      # 以下两条经 shadcn CLI → @dotenvx/dotenvx
  systeminformation@>=5 <5.33.16: ^5.33.16
  node-forge@>=1 <1.4.1: ^1.4.1                    # 以下都是 expo CLI 的依赖，不进 App 包
  compression@>=1 <1.8.2: ^1.8.2
  source-map-js@>=1 <1.2.2: ^1.2.2
  '@xmldom/xmldom@>=0.8 <0.8.15': ^0.8.15
  brace-expansion@>=5 <5.0.11: ^5.0.11
  # #294：Dependabot 剩下的那批同一大版本里能修的
  undici@>=6 <6.29.1: ^6.29.1                      # electron-builder → node-gyp（打包期）
  ip-address@>=10 <10.7.4: ^10.7.4                 # shadcn CLI → socks（开发期）
  brace-expansion@>=1 <1.1.21: ^1.1.21             # 以下两条经 minimatch 旧版：electron 打包（asar）· openapi-typescript（开发期 / 打包期）
  brace-expansion@>=2 <2.1.7: ^2.1.7

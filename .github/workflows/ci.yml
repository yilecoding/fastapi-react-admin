name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消上一次未跑完的，省 runner 也让状态徽章反映最新提交
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 零外部依赖的检查。要 SQL Server 的那部分在下面的 test-backend job 里，
  # 两者并行 —— 拆开是为了让「装 ODBC 驱动 / 等实例」的抖动不污染这条的红绿信号。
  static:
    # 🔴 **这个 name 是分支保护规则按字面引用的，不要改。**
    # `main-github-flow` ruleset 里的 required status check 写的就是
    # `typecheck · build · i18n` 这一串字符 —— job 改名之后那个被要求的检查
    # **永远不会上报**，于是所有 PR 都卡在「等待必需的检查」上，
    # 而 CI 全是绿的、看不出哪里不对（实测：加 ctx:check 时顺手把这行改成
    # `… · ctx`，PR #90 直接变成 not mergeable，排查了半天才找到）。
    #
    # 新增步骤就加在下面的 steps 里，不要动 name。这是「同一件事两个真相源」
    # 的典型：名字同时活在这个文件和 GitHub 的 ruleset 里，而后者不在仓库里。
    name: typecheck · build · i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # 必须放在 pnpm/action-setup 之后 —— 缓存要先知道 pnpm 在哪
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck --force

      # 前端没有自动化测试（已知缺口），所以 build 是目前唯一的
      # 「整个前端还能不能装起来」的信号，别省掉。
      #
      # 🔴 **跑 `pnpm build`（turbo），不要写 `--filter`**（硬纪律 13）。
      # 原来是 `--filter web` + `--filter @admin/mobile` 两条，于是
      # **`apps/desktop` 的主进程/预加载包从来没在 CI 里构建过** ——
      # 它的 `build` 只是两个 `vite build`（`electron-builder` 只在 `package`
      # 里，发版才跑），几秒钟的事，坏了却要等发版才发现。
      #
      # 移动端那一条尤其不能省：typecheck 挡不住它那一类失败，实测踩过的三个
      # 都是「tsc 全绿、bundle 才炸或才静默失效」——
      #   - `global.css` 少了 `@source` → 每个 className 都成空操作（不报错）
      #   - `babel-preset-expo` 没在 devDependencies 里 → Metro 解析不到
      #   - uniwind 令牌在 light/dark 数量不一致 → 那批颜色隐形（export 仍成功）
      - name: build
        run: pnpm build

      # 两个脚本缺一个都会漏：check 管 t('…') 的 key 有没有进语言包，
      # jsx 管压根没进 t() 的裸中文
      - name: i18n
        run: pnpm i18n:check && pnpm i18n:jsx

      # 🔴 **前端单测一直不在 CI 里跑。**
      # `packages/ui` 的 86 条 vitest（三态级联 / URL 序列化 / 网格列状态 /
      # 翻译兜底）加进来的时候，CI 里没有任何一步会执行它们 —— 两个 pytest job
      # 直接调 `uv run pytest`，不走 turbo。一套只在有人想起来时才跑的测试，
      # 和没有这套测试是一回事（和硬纪律 13 里 eslint 那次同一个形状）。
      #
      # ⚠️ 用**排除式**过滤而不是列包名：`apps/api` 的 `test` 是 pytest，
      # 这个 job 没有数据库、跑不了它（它在下面两个 pytest job 里跑）。
      # 排除式的好处是**新增一个 JS 包默认就在里面**，不用改 CI —— 
      # 列包名那种写法正是硬纪律 13 说的「漏了哪个包」。
      - name: unit
        run: pnpm test:js

      # 🔴 **文档的机器可核对部分也要在 CI 里核对。**
      # `ctx:check` 抓死引用 / 死链接 / 死脚本 / 死 testid / 跨文件章节引用，
      # 它整份存在的理由就是「凡是能被机器核对的断言就让机器核对」——
      # 而它自己**一直没进 CI**，只在有人手动跑的时候才跑。
      # 文档腐烂是静默的：它照旧言之凿凿地指着一个已经不存在的文件。
      - name: ctx
        run: pnpm ctx:check

      # 🔴 依赖箭头同理。它比文档更要命：alias / tsconfig paths 写了而
      # `package.json` 没写，会**一直是绿的**，直到某个地方第一次做
      # scoped install —— 上一次是 `apps/web/Dockerfile` 的
      # `pnpm install --filter web...`，在 GHCR 构建里当场炸成一片
      # `Cannot find module 'react'`。整仓 `pnpm install` 永远盖着这个洞。
      - name: arch
        run: pnpm arch:check

  lint-frontend:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 🔴 **跑 `pnpm lint`（= `turbo lint`），不要写 `--filter <某个包>`。**
      #
      # 这里原来是 `pnpm --filter web lint`，于是**别的包的 lint 从来没跑过**：
      #   - `packages/ui` 悄悄红了 58 条（配置和脚本都在，只是没人跑）
      #   - `packages/platform` 声明了 `"lint": "eslint"` 却既没装 eslint 也没配置，
      #     `pnpm lint` 一路 `eslint: not found` —— 一个写在根 CLAUDE.md 里的
      #     脚本坏了很久，因为 CI 绕过了它
      #
      # 用 turbo 跑就没有「漏了哪个包」这回事：谁声明了 lint 谁就在里面。
      - name: eslint
        run: pnpm lint

  lint-backend:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # ⚠️ 版本钉死。用 `ruff@latest` 的话，ruff 一发新版、新增一条规则，
      # CI 就会在没人改代码的情况下变红 —— 升级应该是一次显式的提交。
      #
      # ⚠️ 必须带 --no-fix。仓库的 pyproject 里是 `fix = true` + `unsafe-fixes = true`，
      # 裸 `ruff check` 会**直接改文件**然后报告「已修复」并以 0 退出 ——
      # CI 里那等于静默放过所有可自动修的问题
      - name: ruff check
        working-directory: apps/api
        run: uvx ruff@0.16.4 check --config pyproject.toml --no-fix backend/

  # 纯文档 PR 不跑 E2E 和两个 pytest：它们合起来要 25 分钟左右，而文档改动碰不到
  # 它们测的任何东西。文档自己的闸门（`pnpm build` 里的 Astro 构建 + 源码链接检查、
  # `ctx:check`）在上面的 static job 里，照跑。
  #
  # 🔴 **用 job 级的 `if` 跳，不要用 workflow 级的 `paths-ignore`。** 下面三个 job 里
  # 有两个是 ruleset 要求的检查：job 因为 `if` 被跳过时会上报 skipped，ruleset 把它
  # 当作通过；整个 workflow 被 `paths` 过滤掉的话这些检查**根本不上报**，PR 永远卡在
  # 「等待必需的检查」上（和 static job 改名那次同一个症状）。
  #
  # 🔴 **判断失败时要全跑，不能全跳。** 依赖它的 job 写的是
  # `!cancelled() && docs_only != 'true'`：这个 job 自己挂了，`docs_only` 是空串，
  # 照样全跑。要是写成默认的 `needs` 成功才跑，它一挂下游就全部 skipped，而
  # skipped 算通过 —— 一个没跑测试的 PR 能直接合进去。
  #
  # 什么算「纯文档」：`apps/docs/**`、`docs/**`，以及 `apps/api/` 以外的 `*.md`。
  # `apps/api/` 下的 Markdown 不算，因为有测试在读它
  # （`plugin/open/tests/test_open_signature.py` 核对 `plugin/open/README.md` 里的签名示例）。
  # 以后再有测试读 Markdown，就把那个目录也排除掉。
  # main 上的 push 永远全跑：`pages` 要把 E2E 报告和文档站一起发，跳了会把 /e2e/ 冲掉。
  changes:
    name: 改动范围
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # pull_request 检出的是 refs/pull/N/merge，第一个父提交是 base 的最新提交，
          # 和它比就是「合进去之后到底改了哪些文件」
          fetch-depth: 2

      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames：把 apps/web/x 挪进 apps/docs/ 要同时看到删掉的那一头
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          docs_only=true
          [ -s "$RUNNER_TEMP/changed.txt" ] || docs_only=false
          # `|| [ -n "$f" ]`：最后一行没换行时 read 会返回失败、那一行被漏掉，漏掉的恰好可能是代码文件
          while IFS= read -r f || [ -n "$f" ]; do
            case "$f" in
              apps/docs/* | docs/*) ;;
              apps/api/*) docs_only=false ;;
              *.md) ;;
              *) docs_only=false ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "改动的文件："
          cat "$RUNNER_TEMP/changed.txt"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  test-backend:
    name: pytest · SQL Server
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 真实环境变量的优先级高于 backend/.env（pydantic-settings 里 env_settings
    # 排在 dotenv_settings 前面），所以这里只覆盖与本地开发不同的那几项
    env:
      DATABASE_TYPE: sqlserver
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "1433"
      DATABASE_USER: sa
      DATABASE_PASSWORD: "YourStrong!Passw0rd"
      # 开发库名。测试库由 get_database_url(unittest=True) 推成 <schema>_test
      DATABASE_SCHEMA: fba
      # 🔴 sqlserver 只有 init_snowflake_test_data.sql 这一份种子。改成 autoincrement
      # 会静默跳过灌数据，库建好了却没有 admin，表现是所有登录 401
      DATABASE_PK_MODE: snowflake
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      TOKEN_SECRET_KEY: ci-only-not-a-real-secret-Ku3Jd9wQpZ2vLxR7
      # runner 在境外，插件依赖万一真要现装也别走国内镜像
      PLUGIN_PIP_CHINA: "false"

    services:
      mssql:
        # `@sha256:` 钉住内容——`2022-latest` 本身是浮动标签，见 docker-compose.dev.yml
        # 里的完整说明。升级时显式换这串 digest，不要删掉它让标签重新浮动。
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          # ⚠️ 必须是字符串 'Y'。裸 Y 会被 YAML 解析成布尔 true，
          # 容器起来后立刻退出，日志里只有一句 EULA 未接受
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        # ⚠️ sqlcmd 在 /opt/mssql-tools18/bin —— 老的 /opt/mssql-tools 在 2022 镜像里
        # **不存在**（实测 docker exec 确认）。18 版默认强制加密，不带 -C 会因自签证书连不上。
        # 用 sqlcmd 探活而不是探端口：端口先开、实例没起完那段窗口连上去是 Login failed
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        # 6380 是为了和 .env.example / docker-compose.dev.yml 对齐。
        # 改端口要同步改那两处，否则表现是 Redis 连不上而不是端口问题
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # pyproject 里 python-downloads = "manual"：这里只设版本，真正安装在下面那一步
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # 升到 setup-uv v10 后 `python-version` 只设了 UV_PYTHON、没装 Python（#245 实测：uv sync 报
      # 「No interpreter found for Python 3.13」）。pyproject 是 python-downloads = "manual"，所以显式装一次。
      - run: uv python install 3.13

      # runner 镜像多数版本自带 Driver 18，但不保证。驱动名必须和 DATABASE_DRIVER
      # （默认 'ODBC Driver 18 for SQL Server'）逐字一致，所以装完打印一遍核对
      - name: ODBC Driver 18
        run: |
          if ! command -v odbcinst >/dev/null || ! odbcinst -q -d | grep -q 'ODBC Driver 18 for SQL Server'; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d

      # 插件依赖（aiosmtplib / fastapi-oauth20）已经锁进 uv.lock，这里一并装上。
      # 不装的话 `import backend.main` 顶层的 _prepare_plugins() 会在 pytest 收集阶段
      # 现场联网 uv pip install —— 一次隐式安装，是这类 job 最典型的偶发红
      - name: uv sync
        working-directory: apps/api
        run: uv sync --locked --no-group lint

      # backend/.env 是 gitignore 的。get_settings() 在缺失时会自动 copy 一份，
      # 但那是隐式副作用，显式做掉；与本地不同的项已由 job 级 env 覆盖
      - name: .env
        working-directory: apps/api
        run: cp backend/.env.example backend/.env

      # service 的 healthcheck 已保证实例可登录，这里再补一层带上限的轮询 ——
      # healthy 到「能建库」之间偶尔还有几秒窗口。不用定长 sleep：慢了照挂、快了白等，
      # 而且失败时看不出原因（超时会把容器日志打出来，起不来 90% 是密码复杂度或内存）
      - name: 建库（fba + fba_test）
        env:
          MSSQL_CID: ${{ job.services.mssql.id }}
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $DATABASE_PASSWORD -C -l 5"
          for i in $(seq 1 40); do
            if docker exec "$MSSQL_CID" $SQLCMD -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server 就绪（第 $i 次探测）"; break
            fi
            if [ "$i" -eq 40 ]; then
              echo "SQL Server 120s 内没起来，容器日志："; docker logs --tail 80 "$MSSQL_CID"; exit 1
            fi
            sleep 3
          done
          # fba 建成**空库**即可，不灌种子：应用 lifespan 的 create_tables() 会建表，
          # 而所有测试数据都在 fba_test 里（backend/conftest.py 把三处不走依赖注入的
          # 会话也切到了测试库）。fba 仍必须存在，否则 lifespan 连不上
          docker exec "$MSSQL_CID" $SQLCMD -Q \
            "IF DB_ID('fba') IS NULL CREATE DATABASE [fba]; IF DB_ID('fba_test') IS NULL CREATE DATABASE [fba_test];"

      # drop_all → create_all → 灌种子 → alembic stamp head（stamp 是脚本内建的）
      - name: 重建测试库
        working-directory: apps/api
        run: uv run --no-sync python -m backend.scripts.reset_test_db

      # 🔴 顺序不能调：建库 → test:db → upgrade → pytest。
      # test_model_matches_migrations 拿模型和 fba_test 做 compare_metadata，
      # 顺序错一步会拿到一个和代码无关的假红
      - name: 测试库升到 head
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_test
        run: uv run --no-sync alembic upgrade head

      - name: pytest
        working-directory: apps/api
        run: uv run --no-sync pytest

  # PostgreSQL 的平行 job（issue #5）。
  #
  # 🔴 **2026-09-08 起默认开发库换成了 PostgreSQL，但这个 job 仍然不是「取代」
  # 上面的 `test-backend`。** 两条都是必跑的方言覆盖，结构刻意保持一一对应，
  # 改一个记得看另一个——job id 本身没有改名，改名有弄丢 GitHub 分支保护
  # required checks 的风险，交给要动它的人自己决定。
  #
  # 为什么值得多花这几分钟：postgres 路径此前**零自动化覆盖**——唯一一次验证是
  # 2026-08-25 那次人工部署（腾讯云那台内存装不下 SQL Server），当场炸出两个 bug。
  # 补这个 job 的时候第一次在 postgres 上跑 pytest，又当场炸出三个，全部是
  # 「代码分支存在、但从没被任何自动化跑过」：
  #   1. 五处测试用 `url.replace('/fba?', '/fba_test?')` 换库名，而只有 mssql 的
  #      结果后端 URL 带查询串 —— postgres/mysql 上替换**静默失效**，测试连到开发库
  #   2. `test_fresh_install_has_every_index_the_models_declare` 直接查 `sys.indexes`
  #      （SQL Server 专属系统目录表）
  #   3. `c0000000comments` 用裸 `contextlib.suppress` 容错，而 postgres 里一条语句
  #      失败会毒化整个事务，Python 层吞掉异常救不回来
  # 三条都不是「postgres 支持得不好」，是「没人跑过」。
  #
  # 这个 job 比 test-backend 快得多：不用装 ODBC 驱动，postgres 容器几秒就绪。
  test-backend-postgres:
    name: pytest · PostgreSQL
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_TYPE: postgresql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SCHEMA: fba
      # 🔴 和 sqlserver 同理：postgres 也只有 init_snowflake_test_data.sql 这一份种子，
      # 改成 autoincrement 会静默跳过灌数据，库建好了却没有 admin
      DATABASE_PK_MODE: snowflake
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      TOKEN_SECRET_KEY: ci-only-not-a-real-secret-Ku3Jd9wQpZ2vLxR7
      PLUGIN_PIP_CHINA: "false"

    services:
      postgres:
        # 钉 digest 的理由同 mssql（issue #66）：浮动标签会让 CI 在没人改代码的
        # 情况下变红/变绿。升级时显式换这串，不要删掉它让标签重新浮动。
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # 升到 setup-uv v10 后 `python-version` 只设了 UV_PYTHON、没装 Python（#245 实测：uv sync 报
      # 「No interpreter found for Python 3.13」）。pyproject 是 python-downloads = "manual"，所以显式装一次。
      - run: uv python install 3.13

      - name: uv sync
        working-directory: apps/api
        run: uv sync --locked --no-group lint

      - name: .env
        working-directory: apps/api
        run: cp backend/.env.example backend/.env

      # fba 建成空库即可（理由同 test-backend）；fba_test 是测试库；
      # fba_empty 给下面那条容错分支的守卫用
      - name: 建库（fba + fba_test + fba_empty）
        env:
          PG_CID: ${{ job.services.postgres.id }}
        run: |
          for db in fba fba_test fba_empty fba_upgrade fba_upgrade_test fba_init; do
            docker exec "$PG_CID" psql -U postgres -c "CREATE DATABASE $db;"
          done

      - name: 重建测试库
        working-directory: apps/api
        run: uv run --no-sync python -m backend.scripts.reset_test_db

      # 顺序不能调，理由同 test-backend
      - name: 测试库升到 head
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_test
        run: uv run --no-sync alembic upgrade head

      # 🔴 这一步守的是 `c0000000comments` 里那个「容错」分支 —— 它是整条迁移链上
      # 唯一会**故意让语句失败再吞掉**的地方，而各方言在「失败之后事务还能不能用」
      # 上语义相反（详见那份迁移的 `_tolerate_already_applied()`）。
      # 空库上跑它，8 条 ALTER 全部命中不存在的表，正好把容错分支整条走一遍：
      # 退回裸 suppress 的话，postgres 这里会连环 InFailedSQLTransactionError。
      # 平时这个分支在 CI 里一次都不会执行（测试库是 create_all + stamp head 的）。
      - name: 迁移的容错分支（空库）
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_empty
        run: uv run --no-sync alembic upgrade c0000000comments

      # `-rs`：把跳过的用例连同原因打出来。三份 SDK 的测试在缺 node / JDK 时是 skip 不是失败，
      # 只看「N skipped」分不出它们在 CI 上到底跑没跑（#231）
      - name: pytest
        working-directory: apps/api
        run: uv run --no-sync pytest -rs

      # 🔴 `fba init` 是快速开始让新用户跑的第一条命令（`pnpm db:init`），而上面的库全走 reset_test_db ——
      # 这条路原来在 CI 里一次都不跑。#260 之后它在提交那一刻报「雪花 ID 生成失败，雪花算法未初始化」，
      # 整个事务回滚、库里一张表都没有：新装的人第一步就失败，CI 全绿。
      # 放在 pytest 之后：init 会按前缀清 Redis 里的会话，放前面会把测试套件的登录态清掉。
      - name: fba init（新库，非交互）
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_init
          FBA_INIT_ADMIN_PASSWORD: "Ci-init-only#2026"
          PG_CID: ${{ job.services.postgres.id }}
        run: |
          printf 'y\n' | uv run --no-sync python -c "import sys; sys.argv=['fba','init']; from backend.cli import main; main()"
          # 「成功」要看库里：admin 启用、示例账号 test 被停用、标记到了迁移 head
          q() { docker exec "$PG_CID" psql -U postgres -d fba_init -tAc "$1"; }
          test "$(q "select status from sys_user where username='admin'")" = 1
          test "$(q "select status from sys_user where username='test'")" = 0
          # 要等于 head，不只是「有值」：标成了别的版本，下一次 `pnpm db:upgrade` 会在 create_all 建好的表上重放迁移
          head="$(uv run --no-sync alembic heads 2>/dev/null | grep '(head)' | awk '{print $1}')"
          test -n "$head"
          test "$(q "select version_num from alembic_version")" = "$head"

      # 🔴 「改了模型就必须写迁移」真正的守卫（#230）。上面那轮 pytest 里的
      # test_model_matches_migrations 比的是 fba_test，而 fba_test 是**按当前模型** create_all 出来的 ——
      # 拿模型比一个由模型建出来的库，差异恒为 0，漏写迁移也是绿的（实测：给 sys_role 加一列不写迁移，那条照样 passed）。
      # 这里换成部署时真实发生的路径：用**最近一个 release tag 的代码**建库（和当时 `fba init` 同一条路），
      # 再用当前代码 `alembic upgrade head`，最后拿当前模型去比。漏写迁移 → 缺列 → 红。
      # 只在 postgres 上跑：方言相关的迁移问题由「离线编译」守卫和 SQL Server 那个 job 的全量 pytest 管，
      # 这一步只管「迁移链有没有跟上模型」，跟方言无关。
      - name: 迁移链：从最近一个 release 升到当前
        working-directory: apps/api
        run: |
          # 只认正式版：预发布（v1.1.0-rc.1）在 v:refname 排序里会排到 v1.1.0 前面，而用户是从正式版升上来的
          TAG=$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$TAG" ]; then echo "没有 release tag（fork？），跳过"; exit 0; fi
          echo "基线：$TAG"
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git worktree add "$RUNNER_TEMP/base" "$TAG"
          # 基线用它自己那一版的依赖和种子建库（重建脚本会 stamp 到基线自己的 head）
          (cd "$RUNNER_TEMP/base/apps/api" \
            && cp backend/.env.example backend/.env \
            && uv sync --locked --no-group lint \
            && DATABASE_SCHEMA=fba_upgrade uv run --no-sync python -m backend.scripts.reset_test_db)
          (cd backend && DATABASE_SCHEMA=fba_upgrade_test uv run --no-sync alembic upgrade head)
          DATABASE_SCHEMA=fba_upgrade uv run --no-sync pytest -o addopts="" -q \
            backend/app/task/tests/test_migrations.py::test_model_matches_migrations

      # 🔴 前端契约 `packages/api/src/schema.d.ts` 要和后端同步（#234）。改了接口忘了 `gen:api`，
      # 按 schema 推类型的那一端（移动端 `apps/mobile/src/lib/contract.ts`）就以为参数不存在，而 tsc 全绿。
      # 放在这个 job 而不是 static：`import backend.main` 在导入期就要连 Redis，这里有、那里没有。
      # ⚠️ 生成结果要和开发者本机逐字节一致，前提是后端的插件 / 路由加载顺序不取决于文件系统（#234 修的就是这个，
      # 见 packages/api 分册）。哪天这一步红了而 diff 全是顺序调整，先查是不是又有一处 os.listdir 没排序。
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: 契约新鲜度（schema.d.ts）
        run: |
          pnpm install --frozen-lockfile --filter @admin/api
          pnpm --filter @admin/api gen:api
          git diff --exit-code packages/api/src/schema.d.ts \
            || { echo "::error::schema.d.ts 和后端对不上：跑 pnpm --filter @admin/api gen:api 并提交"; exit 1; }

  test-e2e:
    name: playwright · E2E
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # 整套约 13 分钟（2 个 worker）；login-phone.spec.ts 要等一次 60 秒的短信冷却。15 分钟撞过一次上限（#171），
    # 症状是 job 显示 cancelled 而列表报告里 121 条全过。2026-11-09 main 上已经要 19.5 分钟（20 分钟的上限只剩半分钟），放到 30
    timeout-minutes: 30

    env:
      DATABASE_TYPE: sqlserver
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "1433"
      DATABASE_USER: sa
      DATABASE_PASSWORD: "YourStrong!Passw0rd"
      DATABASE_SCHEMA: fba
      DATABASE_PK_MODE: snowflake
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      REDIS_DATABASE: "2"
      TOKEN_SECRET_KEY: ci-only-not-a-real-secret-Ku3Jd9wQpZ2vLxR7
      PLUGIN_PIP_CHINA: "false"
      # E2E 专用配置
      LOGIN_CAPTCHA_ENABLED: "false"
      ENV_FILE: .env.e2e

    services:
      mssql:
        # `@sha256:` 钉住内容——`2022-latest` 本身是浮动标签，见 docker-compose.dev.yml
        # 里的完整说明。升级时显式换这串 digest，不要删掉它让标签重新浮动。
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # 升到 setup-uv v10 后 `python-version` 只设了 UV_PYTHON、没装 Python（#245 实测：uv sync 报
      # 「No interpreter found for Python 3.13」）。pyproject 是 python-downloads = "manual"，所以显式装一次。
      - run: uv python install 3.13

      - name: ODBC Driver 18
        run: |
          if ! command -v odbcinst >/dev/null || ! odbcinst -q -d | grep -q 'ODBC Driver 18 for SQL Server'; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: uv sync
        working-directory: apps/api
        run: uv sync --locked --no-group lint

      # 🔴 这一步以前写的是 `cp backend/.env.example backend/.env` —— 而这个 job 的
      # `ENV_FILE` 是 `.env.e2e`，没有任何一个进程会去读 `.env`。`backend/.env.e2e`
      # 因此在 CI 里从来没被真正创建过：`_ensure_env_file()` 发现它缺失，会静默地
      # 从 `.env.example` 自动生成一份空白替身（这是给本地开发用的兜底，触发在 CI
      # 里纯属意外），日志里只有一行不起眼的警告。表现：E2E 的 REQUEST_LIMITER_ENABLED
      # 拿不到 e2e 专用的 false，退回类定义的默认值 true。
      #
      # 现在照本地开发的路子来：直接复用 `.env.e2e.example`，它的 DB/Redis 主机、
      # 端口、密码本来就是照这个 job 的 service 配置写的，不用再替换任何字段。
      - name: .env.e2e
        working-directory: apps/api
        run: cp backend/.env.e2e.example backend/.env.e2e

      - name: 建库（fba + fba_test）
        env:
          MSSQL_CID: ${{ job.services.mssql.id }}
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $DATABASE_PASSWORD -C -l 5"
          for i in $(seq 1 40); do
            if docker exec "$MSSQL_CID" $SQLCMD -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server 就绪（第 $i 次探测）"; break
            fi
            if [ "$i" -eq 40 ]; then
              echo "SQL Server 120s 内没起来，容器日志："; docker logs --tail 80 "$MSSQL_CID"; exit 1
            fi
            sleep 3
          done
          docker exec "$MSSQL_CID" $SQLCMD -Q \
            "IF DB_ID('fba') IS NULL CREATE DATABASE [fba]; IF DB_ID('fba_test') IS NULL CREATE DATABASE [fba_test];"

      - name: 重建测试库
        working-directory: apps/api
        run: uv run --no-sync python -m backend.scripts.reset_test_db

      - name: 测试库升到 head
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_test
        run: uv run --no-sync alembic upgrade head

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium

      # 🔴 job 级 DATABASE_SCHEMA=fba 是给「重建测试库」用的（它靠 unittest=True
      # 自己推导出 fba_test，不看这个值本身指向哪）。但 E2E 真正跑起来的 api:e2e
      # 是一个独立的 uvicorn 进程，没有那层推导 —— 环境变量的优先级又高于
      # backend/.env.e2e 里写的 DATABASE_SCHEMA='fba_test'（pydantic-settings
      # 里 env_settings 排在 dotenv_settings 前面），不在这里覆盖回 fba_test 的话，
      # 这个进程会连到建库步骤里那个只 CREATE DATABASE、从没灌过种子的开发库 fba：
      # dev 模式启动会自动 create_all 建表，所以连接看起来正常，就是没有 admin
      # 账号，登录 403，`global-setup.ts` 报的就是这个。
      - name: E2E test
        env:
          DATABASE_SCHEMA: fba_test
        run: pnpm e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          # 只重跑这一个 job 时同一个 run_id 会再传一份同名 artifact——默认不覆盖，
          # 会撞出 2 份同名（download-artifact 这次凑巧没炸，但 pages 那边
          # 同类的 github-pages 重复已经实测炸过一次），显式覆盖更稳。
          overwrite: true

  # 把文档站（`apps/docs`）和 E2E 报告一起发到 GitHub Pages：文档站在根路径，
  # E2E 报告在 `/e2e/`，给它一个每次跑完都刷新、不用手动下载 zip 的固定链接。
  # 🔴 两样东西必须拼进**同一个** artifact 一起发：Pages 每次部署都是整站替换，
  # 拆成两个 job 各发各的，后发的那个会把先发的整份抹掉。
  # 🔴 只在 main 上跑（`pull_request` 事件的 `github.ref` 是 `refs/pull/N/merge`，
  # 天然被这条 if 挡掉）—— fork 来的 PR 拿不到 pages 写权限，硬跑会直接失败；
  # 就算是本仓库自己的 PR，也不该让报告链接被一次性的分支覆盖掉。
  # `if: always()` 是因为最想看报告的时候往往就是 E2E 挂了的那一次。
  pages:
    name: 发布文档站和 E2E 报告到 Pages
    needs: [test-e2e]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # job 级写了 permissions，没列出来的一律是 none —— 下面 checkout 文档站源码要读权限
      contents: read
      pages: write
      id-token: write
      actions: write # 下面清理旧 artifact 要用到（删除 artifact 需要这个权限）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 🔴 「重跑失败的 job」会让这个 job 在同一个 run_id 下再跑一次 attempt，而
      # upload-pages-artifact 每次都无条件建一个新的 "github-pages" artifact，
      # 不会覆盖上一次 attempt 留下的那份——deploy-pages 一读到同名的有 2 份就直接
      # 报错退出（实测踩过：`Multiple artifacts named "github-pages" were
      # unexpectedly found for this workflow run. Artifact count is 2.`）。
      # 这一步在自己上传之前先把这次 run 里同名的旧 artifact 全删掉，
      # 不管这是第几次 attempt，传之前永远先清干净。
      - name: 清理本次 run 里重跑遗留的旧 github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            echo "删除残留 artifact: github-pages (id=$id)"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 文档站每页的「最后更新」读的是 git 历史，浅克隆下每一页都会显示成今天
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @admin/docs

      # 同一份文档还挂在自己的服务器上（fra.wubunan.com/docs/，给国内访问和百度收录）。
      # base 是构建期写死的，所以先按 /docs 构建一份打成包，再按 Pages 的路径构建正式那份；
      # 包放进 Pages 一起发，服务器按 apps/docs/AGENTS.md 里的命令拉下来解压
      - name: 构建服务器版文档（/docs）
        env:
          DOCS_SITE: https://fra.wubunan.com
          DOCS_BASE: /docs
        run: |
          pnpm --filter @admin/docs build
          tar -czf "$RUNNER_TEMP/docs-site.tar.gz" -C apps/docs/dist .

      - run: pnpm --filter @admin/docs build

      - run: cp "$RUNNER_TEMP/docs-site.tar.gz" apps/docs/dist/

      # E2E job 要是在装环境阶段就挂了，就没有报告可下 —— 那也照发文档站，
      # 只在 /e2e/ 放一页说明，免得 README 徽章点进去是 404
      - name: Download playwright report artifact
        id: report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: playwright-report
          path: apps/docs/dist/e2e

      - name: E2E 报告不进搜索索引
        run: |
          if [ "${{ steps.report.outcome }}" = success ]; then
            # 它和文档站同域，不拦的话「Playwright Test Report」会作为本站的一页被收录
            sed -i '0,/<head>/s//<head><meta name="robots" content="noindex">/' apps/docs/dist/e2e/index.html
          else
            mkdir -p apps/docs/dist/e2e
            echo '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>E2E report</title><p>This run produced no E2E report. See <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">the workflow run</a>.</p>' > apps/docs/dist/e2e/index.html
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # 构建生产镜像，推到 GHCR（GitHub Container Registry）。
  # 只在全部质量闸门都过了、且是 main 上的 push 时才跑——镜像是要真的拿去发生产的,
  # 测试没过不能有一个新 tag 出现在 registry 里,哪怕只是躺着没人拉取。
  # 用 GITHUB_TOKEN 登录 ghcr.io：job 级 `packages: write` 权限已经够,不用额外
  # 建 PAT。**第一次跑完之后**要去 GitHub 网页上把这两个 package 的可见性改成
  # public——workflow 用 GITHUB_TOKEN 发布的包默认是 private,服务器上 `docker
  # compose pull` 要么公开、要么在服务器上 `docker login ghcr.io` 一次,选一样。
  # **改包名等于新建包**,新名字第一次推完同样要去改一次可见性。
  #
  # 🔴 镜像从 `fba-*` 改名成 `fra-*`(2026-11),**1.1.x 期间两个名字都推**:
  # 照旧名字部署的人不再收到新镜像时,`docker compose pull` 不报错,只是
  # 永远停在最后一个旧版本上——静默的。1.2.0 起删掉下面两段里 `fba-*` 的三行,
  # 旧包怎么处理见 deploy/AGENTS.md「镜像改名 fba-* → fra-*」。
  build-images:
    name: 构建镜像并推到 GHCR
    needs: [static, lint-frontend, lint-backend, test-backend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 短 SHA 标签是**后补的**：这里原来只推 `sha-${{ github.sha }}`，而
      # `github.sha` 是**完整 40 位** SHA，可所有文档写的回滚命令都是
      # `TAG=sha-abc1234`（GitHub 网页上显示的就是短 SHA，人手里只有这个）。
      # 实测 `docker manifest inspect ghcr.io/…/fba-api:sha-8f92000` →
      # `no such manifest`，换成完整 SHA 才拿得到。回滚是**出事那一刻**才会跑的
      # 命令，照文档敲第一下就失败，最不该在那时候现查。现在三个标签都推：
      # `latest` 日常、短 SHA 给人敲、完整 SHA 给机器引用。
      #
      # `labels` 把提交号写进镜像（OCI 标准字段），`deploy/prod.sh status` 靠它
      # 回答「服务器上跑的是哪个提交、落后 main 多少」——没有这个标签就只能比
      # 镜像摘要，而摘要在走加速器 retag 之后本地根本对不上。
      - name: 短 SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fra-api:latest
            ghcr.io/${{ github.repository_owner }}/fra-api:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/fra-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fba-api:latest
            ghcr.io/${{ github.repository_owner }}/fba-api:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/fba-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fra-api
          cache-to: type=gha,mode=max,scope=fra-api

      - name: Build & push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          build-args: |
            VITE_API_BASE=
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fra-web:latest
            ghcr.io/${{ github.repository_owner }}/fra-web:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/fra-web:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fba-web:latest
            ghcr.io/${{ github.repository_owner }}/fba-web:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/fba-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fra-web
          cache-to: type=gha,mode=max,scope=fra-web

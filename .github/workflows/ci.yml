name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消上一次未跑完的，省 runner 也让状态徽章反映最新提交
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 零外部依赖的检查。要 SQL Server 的那部分在下面的 test-backend job 里，
  # 两者并行 —— 拆开是为了让「装 ODBC 驱动 / 等实例」的抖动不污染这条的红绿信号。
  static:
    name: typecheck · build · i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 必须放在 pnpm/action-setup 之后 —— 缓存要先知道 pnpm 在哪
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck --force

      # 前端没有自动化测试（已知缺口），所以 build 是目前唯一的
      # 「整个前端还能不能装起来」的信号，别省掉
      - name: build
        run: pnpm --filter web build

      # 两个脚本缺一个都会漏：check 管 t('…') 的 key 有没有进语言包，
      # jsx 管压根没进 t() 的裸中文
      - name: i18n
        run: pnpm i18n:check && pnpm i18n:jsx

  lint-frontend:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm --filter web lint

  lint-backend:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ⚠️ 版本钉死。用 `ruff@latest` 的话，ruff 一发新版、新增一条规则，
      # CI 就会在没人改代码的情况下变红 —— 升级应该是一次显式的提交。
      #
      # ⚠️ 必须带 --no-fix。仓库的 pyproject 里是 `fix = true` + `unsafe-fixes = true`，
      # 裸 `ruff check` 会**直接改文件**然后报告「已修复」并以 0 退出 ——
      # CI 里那等于静默放过所有可自动修的问题
      - name: ruff check
        working-directory: apps/api
        run: uvx ruff@0.16.4 check --config pyproject.toml --no-fix backend/

  test-backend:
    name: pytest · SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 真实环境变量的优先级高于 backend/.env（pydantic-settings 里 env_settings
    # 排在 dotenv_settings 前面），所以这里只覆盖与本地开发不同的那几项
    env:
      DATABASE_TYPE: sqlserver
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "1433"
      DATABASE_USER: sa
      DATABASE_PASSWORD: "YourStrong!Passw0rd"
      # 开发库名。测试库由 get_database_url(unittest=True) 推成 <schema>_test
      DATABASE_SCHEMA: fba
      # 🔴 sqlserver 只有 init_snowflake_test_data.sql 这一份种子。改成 autoincrement
      # 会静默跳过灌数据，库建好了却没有 admin，表现是所有登录 401
      DATABASE_PK_MODE: snowflake
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      TOKEN_SECRET_KEY: ci-only-not-a-real-secret-Ku3Jd9wQpZ2vLxR7
      # runner 在境外，插件依赖万一真要现装也别走国内镜像
      PLUGIN_PIP_CHINA: "false"

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          # ⚠️ 必须是字符串 'Y'。裸 Y 会被 YAML 解析成布尔 true，
          # 容器起来后立刻退出，日志里只有一句 EULA 未接受
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        # ⚠️ sqlcmd 在 /opt/mssql-tools18/bin —— 老的 /opt/mssql-tools 在 2022 镜像里
        # **不存在**（实测 docker exec 确认）。18 版默认强制加密，不带 -C 会因自签证书连不上。
        # 用 sqlcmd 探活而不是探端口：端口先开、实例没起完那段窗口连上去是 Login failed
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

      redis:
        image: redis:7-alpine
        # 6380 是为了和 .env.example / docker-compose.dev.yml 对齐。
        # 改端口要同步改那两处，否则表现是 Redis 连不上而不是端口问题
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # pyproject 里 python-downloads = "manual"，不显式指定 uv 不会自己下 Python
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # runner 镜像多数版本自带 Driver 18，但不保证。驱动名必须和 DATABASE_DRIVER
      # （默认 'ODBC Driver 18 for SQL Server'）逐字一致，所以装完打印一遍核对
      - name: ODBC Driver 18
        run: |
          if ! command -v odbcinst >/dev/null || ! odbcinst -q -d | grep -q 'ODBC Driver 18 for SQL Server'; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d

      # 插件依赖（aiosmtplib / fastapi-oauth20）已经锁进 uv.lock，这里一并装上。
      # 不装的话 `import backend.main` 顶层的 _prepare_plugins() 会在 pytest 收集阶段
      # 现场联网 uv pip install —— 一次隐式安装，是这类 job 最典型的偶发红
      - name: uv sync
        working-directory: apps/api
        run: uv sync --locked --no-group lint

      # backend/.env 是 gitignore 的。get_settings() 在缺失时会自动 copy 一份，
      # 但那是隐式副作用，显式做掉；与本地不同的项已由 job 级 env 覆盖
      - name: .env
        working-directory: apps/api
        run: cp backend/.env.example backend/.env

      # service 的 healthcheck 已保证实例可登录，这里再补一层带上限的轮询 ——
      # healthy 到「能建库」之间偶尔还有几秒窗口。不用定长 sleep：慢了照挂、快了白等，
      # 而且失败时看不出原因（超时会把容器日志打出来，起不来 90% 是密码复杂度或内存）
      - name: 建库（fba + fba_test）
        env:
          MSSQL_CID: ${{ job.services.mssql.id }}
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $DATABASE_PASSWORD -C -l 5"
          for i in $(seq 1 40); do
            if docker exec "$MSSQL_CID" $SQLCMD -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server 就绪（第 $i 次探测）"; break
            fi
            if [ "$i" -eq 40 ]; then
              echo "SQL Server 120s 内没起来，容器日志："; docker logs --tail 80 "$MSSQL_CID"; exit 1
            fi
            sleep 3
          done
          # fba 建成**空库**即可，不灌种子：应用 lifespan 的 create_tables() 会建表，
          # 而所有测试数据都在 fba_test 里（backend/conftest.py 把三处不走依赖注入的
          # 会话也切到了测试库）。fba 仍必须存在，否则 lifespan 连不上
          docker exec "$MSSQL_CID" $SQLCMD -Q \
            "IF DB_ID('fba') IS NULL CREATE DATABASE [fba]; IF DB_ID('fba_test') IS NULL CREATE DATABASE [fba_test];"

      # drop_all → create_all → 灌种子 → alembic stamp head（stamp 是脚本内建的）
      - name: 重建测试库
        working-directory: apps/api
        run: uv run --no-sync python -m backend.scripts.reset_test_db

      # 🔴 顺序不能调：建库 → test:db → upgrade → pytest。
      # test_model_matches_migrations 拿模型和 fba_test 做 compare_metadata，
      # 顺序错一步会拿到一个和代码无关的假红
      - name: 测试库升到 head
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_test
        run: uv run --no-sync alembic upgrade head

      - name: pytest
        working-directory: apps/api
        run: uv run --no-sync pytest

  test-e2e:
    name: playwright · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_TYPE: sqlserver
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "1433"
      DATABASE_USER: sa
      DATABASE_PASSWORD: "YourStrong!Passw0rd"
      DATABASE_SCHEMA: fba
      DATABASE_PK_MODE: snowflake
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      REDIS_DATABASE: "2"
      TOKEN_SECRET_KEY: ci-only-not-a-real-secret-Ku3Jd9wQpZ2vLxR7
      PLUGIN_PIP_CHINA: "false"
      # E2E 专用配置
      LOGIN_CAPTCHA_ENABLED: "false"
      ENV_FILE: .env.e2e

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: ODBC Driver 18
        run: |
          if ! command -v odbcinst >/dev/null || ! odbcinst -q -d | grep -q 'ODBC Driver 18 for SQL Server'; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: uv sync
        working-directory: apps/api
        run: uv sync --locked --no-group lint

      # 🔴 这一步以前写的是 `cp backend/.env.example backend/.env` —— 而这个 job 的
      # `ENV_FILE` 是 `.env.e2e`，没有任何一个进程会去读 `.env`。`backend/.env.e2e`
      # 因此在 CI 里从来没被真正创建过：`_ensure_env_file()` 发现它缺失，会静默地
      # 从 `.env.example` 自动生成一份空白替身（这是给本地开发用的兜底，触发在 CI
      # 里纯属意外），日志里只有一行不起眼的警告。表现：E2E 的 REQUEST_LIMITER_ENABLED
      # 拿不到 e2e 专用的 false，退回类定义的默认值 true。
      #
      # 现在照本地开发的路子来：直接复用 `.env.e2e.example`，它的 DB/Redis 主机、
      # 端口、密码本来就是照这个 job 的 service 配置写的，不用再替换任何字段。
      - name: .env.e2e
        working-directory: apps/api
        run: cp backend/.env.e2e.example backend/.env.e2e

      - name: 建库（fba + fba_test）
        env:
          MSSQL_CID: ${{ job.services.mssql.id }}
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $DATABASE_PASSWORD -C -l 5"
          for i in $(seq 1 40); do
            if docker exec "$MSSQL_CID" $SQLCMD -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server 就绪（第 $i 次探测）"; break
            fi
            if [ "$i" -eq 40 ]; then
              echo "SQL Server 120s 内没起来，容器日志："; docker logs --tail 80 "$MSSQL_CID"; exit 1
            fi
            sleep 3
          done
          docker exec "$MSSQL_CID" $SQLCMD -Q \
            "IF DB_ID('fba') IS NULL CREATE DATABASE [fba]; IF DB_ID('fba_test') IS NULL CREATE DATABASE [fba_test];"

      - name: 重建测试库
        working-directory: apps/api
        run: uv run --no-sync python -m backend.scripts.reset_test_db

      - name: 测试库升到 head
        working-directory: apps/api/backend
        env:
          DATABASE_SCHEMA: fba_test
        run: uv run --no-sync alembic upgrade head

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium

      # 🔴 job 级 DATABASE_SCHEMA=fba 是给「重建测试库」用的（它靠 unittest=True
      # 自己推导出 fba_test，不看这个值本身指向哪）。但 E2E 真正跑起来的 api:e2e
      # 是一个独立的 uvicorn 进程，没有那层推导 —— 环境变量的优先级又高于
      # backend/.env.e2e 里写的 DATABASE_SCHEMA='fba_test'（pydantic-settings
      # 里 env_settings 排在 dotenv_settings 前面），不在这里覆盖回 fba_test 的话，
      # 这个进程会连到建库步骤里那个只 CREATE DATABASE、从没灌过种子的开发库 fba：
      # dev 模式启动会自动 create_all 建表，所以连接看起来正常，就是没有 admin
      # 账号，登录 403，`global-setup.ts` 报的就是这个。
      - name: E2E test
        env:
          DATABASE_SCHEMA: fba_test
        run: pnpm e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # 把 E2E 报告发到 GitHub Pages，给一个每次跑完都刷新、不用手动下载 zip 的固定链接。
  # 🔴 只在 main 上跑（`pull_request` 事件的 `github.ref` 是 `refs/pull/N/merge`，
  # 天然被这条 if 挡掉）—— fork 来的 PR 拿不到 pages 写权限，硬跑会直接失败；
  # 就算是本仓库自己的 PR，也不该让报告链接被一次性的分支覆盖掉。
  # `if: always()` 是因为最想看报告的时候往往就是 E2E 挂了的那一次。
  pages-report:
    name: 发布 E2E 报告到 Pages
    needs: [test-e2e]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 构建生产镜像，推到 GHCR（GitHub Container Registry）。
  # 只在全部质量闸门都过了、且是 main 上的 push 时才跑——镜像是要真的拿去发生产的,
  # 测试没过不能有一个新 tag 出现在 registry 里,哪怕只是躺着没人拉取。
  # 用 GITHUB_TOKEN 登录 ghcr.io：job 级 `packages: write` 权限已经够,不用额外
  # 建 PAT。**第一次跑完之后**要去 GitHub 网页上把这两个 package 的可见性改成
  # public——workflow 用 GITHUB_TOKEN 发布的包默认是 private,服务器上 `docker
  # compose pull` 要么公开、要么在服务器上 `docker login ghcr.io` 一次,选一样。
  build-images:
    name: 构建镜像并推到 GHCR
    needs: [static, lint-frontend, lint-backend, test-backend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 两个标签都推：`latest` 给日常部署用，短 SHA 给回滚用——出问题时服务器上
      # 把 .env.server 同目录的 TAG 环境变量设成某个短 SHA 再 `deploy:prod:pull`，
      # 不用等一次新的构建。
      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fba-api:latest
            ghcr.io/${{ github.repository_owner }}/fba-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=fba-api
          cache-to: type=gha,mode=max,scope=fba-api

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          build-args: |
            VITE_API_BASE=
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fba-web:latest
            ghcr.io/${{ github.repository_owner }}/fba-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=fba-web
          cache-to: type=gha,mode=max,scope=fba-web

  # ── CI 红了报一条 issue，但**一个 ref 只留一条** ──
  #
  # 🔴 原来的写法每失败一次就新开一条。它确实写了「查找已有的失败 issue，
  # 避免重复」，但判据是 `issue.body.includes('[#' + runId + ']')` —— runId
  # 每次运行都不一样，这个条件**永远不可能命中**，去重形同虚设。实测：一个
  # 下午攒了 8 条 `🔴 CI Failed`，其中 5 条是 main 上同一个问题、2 条是同一个
  # PR 的同一个 flake。
  #
  # 现在的机制是**覆盖**：body 里埋一个 `<!-- ci-failure-key: 工作流@ref -->`
  # 标记，同一个 ref 再失败就把那一条的正文改成最新一次运行（带「连续失败 N 次」），
  # 不新开、也不追评论。绿了由下面的 clear-failure-report 自动关掉。
  report-failure:
    name: Report Failures
    needs: [static, lint-frontend, lint-backend, test-backend, test-e2e]
    # 只报 push（main）的失败。PR 上的失败在 PR 自己的 checks 里已经很显眼，
    # 再开一条 issue 是纯噪音 —— 而且 PR 分支用完就删，issue 却留着，
    # 谁都不知道该不该关
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Upsert CI failure issue
        uses: actions/github-script@v7
        env:
          # 哪几个 job 红的 —— 一条 issue 要能直接回答这个问题，
          # 否则每次都得点进 Actions 看
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const key = `${context.workflow}@${context.ref}`;
            const marker = `<!-- ci-failure-key: ${key} -->`;

            const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success')
              .map(([k, v]) => `\`${k}\` (${v.result})`);

            // 按 marker 找那一条，不是按 runId（原来的 bug 就在这）
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(marker));

            // 「连续失败 N 次」从上一版正文里读回来 —— 不另存状态，
            // issue 自己就是那份状态
            const prev = existing ? Number((existing.body.match(/连续失败\*\*: (\d+) 次/) || [])[1]) || 1 : 0;
            const streak = prev + 1;

            const title = `🔴 CI Failed: ${context.workflow} on ${context.ref}`;
            const body = [
              marker,
              '## CI 检查失败',
              '',
              `- **分支**: \`${context.ref}\``,
              `- **提交**: ${context.sha.substring(0, 7)}`,
              `- **失败的 job**: ${failed.length ? failed.join(' · ') : '（未知）'}`,
              `- **连续失败**: ${streak} 次`,
              `- **最近一次运行**: [#${context.runId}](${runUrl})`,
              `- **触发**: ${context.eventName}`,
              '',
              '这条 issue 由 CI 维护：同一个 ref 再失败会**覆盖**这里的内容，',
              '恢复绿色时自动关闭。要手工关的话也行 —— 下次失败会重新开一条。',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body,
              });
              console.log(`Updated issue #${existing.number}（连续失败 ${streak} 次）`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ['ci-failure', 'bug'],
              });
              console.log(`Created issue #${created.data.number}`);
            }

  # 绿了就把那条失败 issue 关掉。没有这一半，上面那条永远留在列表里 ——
  # 「CI 现在是红的还是绿的」就只能靠人去 Actions 里对，而没人会去对
  clear-failure-report:
    name: Clear Failure Report
    needs: [static, lint-frontend, lint-backend, test-backend, test-e2e]
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = `<!-- ci-failure-key: ${context.workflow}@${context.ref} -->`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });
            for (const issue of open.filter((i) => (i.body || '').includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ CI 在 ${context.sha.substring(0, 7)} 恢复绿色（[run](${runUrl})），自动关闭。`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
              console.log(`Closed issue #${issue.number}`);
            }

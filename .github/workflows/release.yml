# 打 tag 发桌面端安装包（三个平台）。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 跑完会在 GitHub 上留一个**草稿** release，人工确认后再发布 —— 安装包能不能装、
# 能不能连上后端，机器判不了。
#
# 不打 tag 也能试：Actions → Release → Run workflow，产物作为 workflow artifact
# 上传，**不碰 release、不签名**（闸门只在 tag 上跑，试跑拿不到证书，#393）。一条从没跑过的发布流水线，第一次跑一定是在最不该出错的时候。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '试跑用的版本号（不发布，只出包）'
        required: false
        default: '0.0.0-dev'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 草稿必须**先建好、且只建一次**。三个平台的 job 同时跑，谁都去建的话就会
  # 撞出多个草稿 —— GitHub 的草稿不按 tag 去重，实测踩过（v0.0.1-rc.1 当场劈成两个，
  # 一个只有 blockmap、另一个有 exe，而那次运行还是「成功」）。
  prepare:
    name: 建草稿 Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 版本号的单一来源是 apps/web/package.json —— vite.config.ts 把它注入成
      # VITE_APP_VERSION，brand.ts 和 /version.json 都读那个值。
      # 🔴 这里原来是拿正则去 brand.ts 里抠 `version: "x.y.z"`，brand.ts 改成读
      # import.meta.env 之后那个正则就再也匹配不上了，而 v0.0.1 之后没人打过 tag，
      # 所以没人发现：下一次打 tag 会在第一个 job 上「找不到 version 字段」直接红掉
      # 后端的 `backend/__init__.py: __version__` 是第二份（/docs 徽章、OTel service.version 读它，
      # 后端镜像的构建上下文只有 apps/api，运行时读不到 package.json），所以这里顺手核对两边同值
      - name: 校验 tag 与 package.json / 后端 __version__ 一致
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs')
            const pkg = require('./apps/web/package.json').version
            const api = (fs.readFileSync('./apps/api/backend/__init__.py', 'utf8').match(/^__version__ = '([^']+)'/m) || [])[1]
            const tag = process.argv[1]
            // 允许预发布后缀：package.json 是 0.0.1 时 v0.0.1 与 v0.0.1-rc.1 都算一致。
            // 「发到 Release」那一步没法本地验证，得留个能试的口子
            if (!(pkg === tag || tag.startsWith(pkg + '-'))) {
              console.error(\`不一致：apps/web/package.json 是 \${pkg}，tag 是 v\${tag}。先改 package.json 再重新打 tag。\`)
              process.exit(1)
            }
            if (api !== pkg) {
              console.error(\`不一致：apps/api/backend/__init__.py 的 __version__ 是 \${api}，package.json 是 \${pkg}。两处要同值。\`)
              process.exit(1)
            }
            console.log(\`一致：package.json \${pkg} = 后端 __version__ \${api} ← tag v\${tag}\`)
          " "$VER"

      # 🔴 打 tag 就出签名安装包，所以先确认这个提交「在 main 上、且 main 上那一轮 CI 全绿」（#232）。
      # 不查的话，在本地分支上随手打个 tag 推上去，没过评审、没过测试的代码就带着证书签名发出去了。
      # 合并后马上打 tag 时 CI 多半还在跑（E2E 约 20 分钟），所以这里等它跑完，最多 75 分钟
      # （重跑旧提交时要先排在 HEAD 那一轮后面，约 20 分钟排队 + 20 分钟自己跑，45 分钟不够，#374）。
      # ⚠️ ci.yml 在 main 上是 cancel-in-progress：tag 的提交后面又合了别的 PR，这个提交的 CI 会被取消 →
      # 这里报错。到 Actions 里把那一轮 re-run 绿了，再重跑本 workflow 即可。重跑不会取消 HEAD 正在跑的那一轮
      # （ci.yml 只在 run_attempt == 1 时 cancel-in-progress），而是排在它后面 —— 所以会先等 HEAD 跑完。
      # 旧提交重跑只补质量检查和 SHA 镜像；latest 与 Pages 仅发布 main 当前提交。
      # 🔴 预发布 tag（v1.2.0-rc.1）**同样拦**（#393）。原来带 `-` 的只警告不拦，任意分支打个 `v1.1.0-x`
      # 就能出包、把 latest.yml 传进草稿。要试流水线本身用 Run workflow（workflow_dispatch：不碰 Release、不签名）；
      # 要试「发到 Release」那一步，就在 main 上一个 CI 绿的提交上打预发布 tag。
      # 判定在 scripts/release-gate.mjs（测试：scripts/tests/release-gate.test.mjs，pnpm test:ci）。
      - name: tag 的提交在 main 上，且 CI 已经绿了
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.mjs

      # 🔴 预发布要标 prerelease（#393）：没标的话维护者点了发布，GitHub 就把它当 latest，
      # 走默认更新源的桌面端（electron-updater 默认不拉 prerelease）会自动升上去。
      # 草稿已存在（重跑）时也补一次标记 —— 那份草稿可能是修这条之前建的。
      - name: 建草稿（已存在就跳过）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.gate.outputs.prerelease }}
        run: |
          FLAG=""
          if [ "$PRERELEASE" = true ]; then FLAG="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "草稿已存在，复用"
            if [ -n "$FLAG" ]; then gh release edit "$GITHUB_REF_NAME" --prerelease; fi
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" --draft $FLAG \
              --title "$GITHUB_REF_NAME" \
              --notes-file apps/desktop/release-notes.md \
              --generate-notes
          fi
          echo "prerelease=$PRERELEASE"

  build:
    name: ${{ matrix.label }}
    needs: [prepare]
    # 试跑（workflow_dispatch）时 prepare 被 if 跳过，这里要显式放行
    if: always() && (needs.prepare.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      # 一个平台挂了不要连坐 —— 另外两个的包仍然值得拿到
      fail-fast: false
      matrix:
        include:
          # 🔴 每个平台只能在自己的机器上打：mac 的 dmg 要 macOS 工具链，
          # Windows 的 nsis 从 mac/linux 交叉打要 Wine（不做）
          - os: windows-latest
            label: Windows（NSIS 安装包）
            glob: 'apps/desktop/release/*/*.exe'
          - os: macos-latest
            label: macOS（dmg + zip，arm64 / x64）
            glob: 'apps/desktop/release/*/*.dmg apps/desktop/release/*/*.zip'
          - os: ubuntu-latest
            label: Linux（AppImage）
            glob: 'apps/desktop/release/*/*.AppImage'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        # windows runner 默认是 pwsh，而下面用了 `${VAR#v}` 这类 POSIX 展开
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # 必须放在 pnpm/action-setup 之后 —— 缓存要先知道 pnpm 在哪
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 版本号的单一来源是 tag。electron-builder 读的是 apps/desktop/package.json，
      # 所以这里把 tag 写进去（**不提交**，只在这次构建的工作区里生效）。
      # 🔴 手填的版本号走环境变量，不要 `${{ inputs.version }}` 直接插进 shell（#232）：
      # 那是模板替换，值里的引号 / `$(…)` 会被当成脚本执行，而这个 job 拿着写权限和签名证书。
      # 同时校验格式，挡住一切不像版本号的输入
      - name: 定版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$INPUT_VERSION"
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号格式不对：$VER"; exit 1
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs')
            const f = 'apps/desktop/package.json'
            const p = JSON.parse(fs.readFileSync(f, 'utf8'))
            p.version = process.argv[1]
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n')
          " "$VER"
          echo "桌面端版本号 → $VER"

      # 渲染层。⚠️ `VITE_API_BASE` 必须是空：桌面端的后端地址是**运行期配置**
      # （userData/config.json 的 serverUrl），编译期写死会让同一个包只能连一个环境。
      # 🔴 空串本身不让桌面端连上后端（#392）：渲染层在桌面端改取 preload 同步给的 `window.desktop.serverUrl`
      # （platform `api-client/base-url.ts`），没配时登录页先让用户填地址。在桌面端这个变量其实被忽略。
      - name: 构建渲染层
        env:
          VITE_API_BASE: ''
        run: pnpm --filter web build

      # 🔴 一律 `--publish never`，产物由下面的步骤用 gh 传。
      # electron-builder 自己传会撞竞态（见 apps/desktop/AGENTS.md 的「在线更新」一节）。
      # 签名是**可选**的：仓库里配了对应 secrets 就签，没配就出未签名包 ——
      # 两条路都能跑通，区别只在用户端会不会被 SmartScreen / Gatekeeper 拦。
      # 怎么申请免费证书、以及 Windows 那条为什么不能「打完再签」，见 apps/desktop/AGENTS.md
      # 🔴 证书只给 push（tag）构建（#393）：push 下 build 必须等 prepare 成功，也就是过了上面「在 main 上、CI 绿」
      # 的闸门；workflow_dispatch 跳过了 prepare，在任意未评审分支上点 Run workflow 都能跑到这里。
      # 不门控的话，接上证书那天，试跑就能拿到带正式签名的包。试跑一律出未签名包（下面会 unset 空值）
      - name: 出安装包
        env:
          # Windows / macOS 通用：electron-builder 认这两个（.pfx / .p12）
          CSC_LINK: ${{ github.event_name == 'push' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.CSC_KEY_PASSWORD || '' }}
          # macOS 公证（notarize）用
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # 🔴 没配的 secret 在这里是**空串**，不是「没有这个变量」—— 而 electron-builder 26 把空串的
          # CSC_LINK 当成一个值（源码注释「allow to specify as empty string」），解析成当前目录，
          # macOS 那一步当场 `apps/desktop not a file`。Windows / Linux 不走那条路，所以只有 mac 红。
          # 没配就整个 unset 掉，让它回到「没有证书 → 出未签名包」
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v:-}" ] && unset "$v"
          done
          EXTRA=""
          # 只有拿到 Apple 的凭据才开公证 —— 无条件写进 electron-builder.yml 的话，
          # 没凭据的构建会**直接失败**，而现在这种「没证书也能出包」是刻意保留的
          if [ -n "${APPLE_TEAM_ID:-}" ] && [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="--config.mac.notarize.teamId=$APPLE_TEAM_ID"
            echo "启用 macOS 公证（teamId=$APPLE_TEAM_ID）"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "⚠️ 未配 APPLE_* secrets —— 出的是未签名未公证的包，用户要手动过 Gatekeeper"
          fi
          # ⚠️ 主进程/preload 要先编 —— `package:ci` 里那一步在这里是手动的，
          # 漏了它打进包的是上一次的 dist/
          pnpm --filter @admin/desktop build
          pnpm --filter @admin/desktop exec electron-builder \
            --config electron-builder.yml --publish never $EXTRA

      - name: 传到草稿 Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.value }}"
          DIR="apps/desktop/release/$VER"
          ls -lh "$DIR"

          # 安装包本体 + blockmap（差量更新用）。三个平台各传各的，互不覆盖
          # shellcheck disable=SC2086
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.glob }} --clobber
          for f in "$DIR"/*.blockmap; do
            [ -e "$f" ] && gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done

          # 🔴 更新清单**最后**传：它先落地的话，中间那几秒里客户端会拿到 404
          # 或者半个包 —— 而这两种都不报「更新源没准备好」。
          # 三个平台的清单文件名不同（latest.yml / latest-mac.yml / latest-linux.yml），
          # 所以互不相踩
          for f in "$DIR"/latest*.yml; do
            [ -e "$f" ] && gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done

      - name: 上传产物（试跑时留个下载入口）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ steps.ver.outputs.value }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage
          if-no-files-found: error

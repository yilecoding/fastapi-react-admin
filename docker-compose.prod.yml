# 生产编排（SQL Server 主线）。
#
#     cp apps/api/deploy/backend/docker-compose/.env.server.example \
#        apps/api/deploy/backend/docker-compose/.env.server
#     # 改完里面的 CHANGE_ME，然后：
#     docker compose -f docker-compose.prod.yml build
#     docker compose -f docker-compose.prod.yml up -d
#
# 与 apps/api/docker-compose.yml 的关系：那份是**上游的**（主库 PostgreSQL、
# broker RabbitMQ、挂的还是已废弃的 static/upload 路径），照它起不来。
#
# ⚠️ 构建前先确认 **docker daemon 自己**够得着镜像仓库。它不读 shell 的
# http_proxy —— 本机实测：curl 拿得到 ghcr.io，`docker build` 却 i/o timeout，
# 报错指向 Dockerfile 的 FROM 行，看起来像镜像名写错了。要在 WSL / 代理环境里构建，
# 给 daemon 单独配一次：
#
#     sudo mkdir -p /etc/systemd/system/docker.service.d
#     sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf <<'EOF'
#     [Service]
#     Environment="HTTP_PROXY=http://<代理>:<端口>"
#     Environment="HTTPS_PROXY=http://<代理>:<端口>"
#     Environment="NO_PROXY=localhost,127.0.0.1"
#     EOF
#     sudo systemctl daemon-reload && sudo systemctl restart docker
#
# 🔴 **SQL Server 和 Redis 都不进这份编排**，各自独立部署、独立运维：
#   1. `docker compose down -v` 一条命令就能把生产数据（DB + 缓存）一起抹掉
#   2. SQL Server 官方镜像默认 sa 账号，Developer 版授权只允许开发/测试用途；
#      Redis 同理——测试用的 `redis:7-alpine` 直接进生产编排没有密码轮换、
#      持久化策略、内存上限这些运维手段，跟着应用容器一起被 `down` 掉更不划算
#   3. 应用容器无状态才能滚动重启；有状态服务混进来会逼着每次发版都碰数据库/缓存
# 这份编排只剩**无状态**的应用容器：api / worker / beat / web，外加一次性的
# migrate。`.env.server` 里的 `DATABASE_*` / `REDIS_*` 指向哪，它们就连哪 ——
# 跟这份文件在不在同一台机器、用不用容器，这份编排完全不关心。
#
# ⚠️ 如果 SQL Server / Redis 就跑在**这台宿主机**上、但不在 Docker 里（比如宝塔
# 面板自带的 Redis/MySQL 管理），容器默认桥接网络连不到宿主机的 `127.0.0.1` ——
# 那是容器自己的回环地址，不是宿主机的。`.env.server` 里的 `DATABASE_HOST` /
# `REDIS_HOST` 要填宿主机在 docker 网桥上的地址（一般是 `172.17.0.1`，
# `ip addr show docker0` 能查到），或者给下面的服务加
# `extra_hosts: ["host.docker.internal:host-gateway"]` 再填
# `host.docker.internal`。直接填 `127.0.0.1`/`localhost` 是最常见的踩坑，
# 表现是 API 容器起来了、健康检查却一直连不上数据库/Redis。

name: fastapi-react-admin

x-api-base: &api-base
  image: fba-api:${TAG:-latest}
  build:
    context: ./apps/api
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  environment:
    TZ: Asia/Shanghai
  # 挂成容器里的 backend/.env。⚠️ 缺这个文件时应用会**拒绝启动**而不是
  # 自动拷示例（conf.py: _ensure_env_file 检测到 /.dockerenv 即视为生产形态）
  volumes:
    - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
    - fba_upload:/app/backend/upload
    - fba_upload_public:/app/backend/upload-public
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # 跑一次性的 schema 迁移，跑完才允许 API 接流量。
  # 部署前先备份外部 SQL Server；Alembic 没有自动回滚。
  migrate:
    <<: *api-base
    restart: "no"
    command:
      - sh
      - -c
      - cd /app/backend && alembic upgrade head
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro

  api:
    <<: *api-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
      - fba_upload:/app/backend/upload
      - fba_upload_public:/app/backend/upload-public
      - fba_log_api:/app/backend/log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      # prod 启动时要校验 alembic 版本 + 扫种子密码，给足时间
      start_period: 90s

  worker:
    <<: *api-base
    # 可以多副本：`docker compose up -d --scale worker=3`，所以刻意不设 container_name
    command:
      - celery
      - -A
      - backend.app.task.celery
      - worker
      - -l
      - info
      - --pool=custom
    environment:
      TZ: Asia/Shanghai
      CELERY_CUSTOM_WORKER_POOL: celery_aio_pool.pool:AsyncIOPool
    # 🔴 之前漏挂了这条——worker 没等 migrate 跑完就可能先起来，
    # 拿旧表结构处理任务。api 已经在挡这个坑（depends_on migrate），
    # worker 会碰数据库的路径和 api 一样多，没道理不用同一条闸门。
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
      - fba_upload:/app/backend/upload
      - fba_upload_public:/app/backend/upload-public
      - fba_log_worker:/app/backend/log
    healthcheck:
      test: ["CMD", "celery", "-A", "backend.app.task.celery", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  beat:
    <<: *api-base
    # 🔴 **只能一个副本。** 多个 beat = 同一条调度被触发 N 次（根 CLAUDE.md）。
    # container_name 在这里是**故意**写的 —— 它会让 `--scale beat=2` 直接失败，
    # 而不是安静地起两个
    container_name: fba_beat
    command:
      - celery
      - -A
      - backend.app.task.celery
      - beat
      - -l
      - info
    depends_on:
      # 等 api 把 task_scheduler 表准备好
      api:
        condition: service_healthy
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
      - fba_log_beat:/app/backend/log
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: fba-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 空串 = 同源相对路径，由 nginx 反代到 api。见 apps/web/Dockerfile 的说明
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      # TLS 建议交给上游 LB / Caddy / 宝塔的反代，这里只出 80
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  # 私有附件 —— 只能经 /api/v1/sys/files/{pk}/download 读
  fba_upload:
  # 富文本内联图 —— 经 /uploads 无鉴权读，两棵树不能合并
  fba_upload_public:
  fba_log_api:
  fba_log_worker:
  fba_log_beat:

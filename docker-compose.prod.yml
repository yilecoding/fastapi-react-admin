# 生产编排（SQL Server 主线）。
#
#     cp apps/api/deploy/backend/docker-compose/.env.server.example \
#        apps/api/deploy/backend/docker-compose/.env.server
#     # 改完里面的 CHANGE_ME，然后二选一：
#
#   🔴 **这份文件的属主必须是 uid:gid 1000:1000，不能是 root。**
#   `apps/api/Dockerfile.prod` 里容器进程是 `USER fba`（`useradd -u 1000 -g 1000`），
#   而 `scripts/deploy-prod.mjs` 的前置检查又要求这份文件权限严格是 `600`
#   （不能有 group/other 位）——如果只满足"600"但 owner 是 root，宿主机上看着
#   权限没问题，容器里的 fba 用户却读不到它：pydantic-settings 加载配置那一步
#   直接 `PermissionError: [Errno 13] Permission denied`，报错点在依赖库内部，
#   不会提示"权限"两个字，容易当成配置本身写错了去排查。实测：`chmod 600`
#   但 owner 仍是 root 时必现；改成 `chown 1000:1000 && chmod 600` 后两边
#   （deploy 脚本的安全检查 + 容器内非 root 用户可读）同时满足：
#
#     chown 1000:1000 apps/api/deploy/backend/docker-compose/.env.server
#     chmod 600       apps/api/deploy/backend/docker-compose/.env.server
#
# 【日常部署】CI 已经把镜像 build 好推到 GHCR 了，服务器只管拉：
#
#     docker compose -f docker-compose.prod.yml pull
#     docker compose -f docker-compose.prod.yml up -d
#
#   镜像名固定用 `ghcr.io/<owner>/fba-api` / `fba-web`，标签有 `latest` 和
#   `sha-<短 SHA>` 两种——回滚就是把 `TAG` 环境变量设成某个短 SHA 再重新
#   `pull` + `up -d`，不用等一次新的构建：
#
#     TAG=sha-abc1234 docker compose -f docker-compose.prod.yml pull
#     TAG=sha-abc1234 docker compose -f docker-compose.prod.yml up -d
#
#   ⚠️ CI 用 GITHUB_TOKEN 发布到 GHCR 的包**默认是 private**，第一次跑完后
#   要去 GitHub 网页上把这两个 package 的可见性改成 public（仓库本来就是
#   public 的，没有理由把编译产物设成私有），否则这里的 `pull` 会因为没
#   登录而失败。也可以反过来在服务器上 `docker login ghcr.io` 一次，看你选哪条。
#
#   🔴 **国内服务器直连 `ghcr.io` 可能被限速到几十 KB/s**，不是断连、也不报错，
#   `docker compose pull` 会挂着不动，看着像卡住了其实是在以「一层镜像下载
#   几个小时」的速度爬。实测（腾讯云国内节点）：`curl` 探测 `ghcr.io` 能通、
#   `docker pull` 却常年卡在 ~30KB/s；换成镜像加速器 `ghcr.nju.edu.cn` 同一层
#   几秒钟拉完。判断卡没卡看 `docker compose pull` 的层进度是否在涨，几分钟
#   完全不动就该换加速器，不要傻等。加速器不能直接替换 compose 里的镜像名
#   （它们只是同步了内容、路径前缀不一样），要拉完再重新打标签：
#
#     docker pull ghcr.nju.edu.cn/<owner>/fba-api:latest
#     docker pull ghcr.nju.edu.cn/<owner>/fba-web:latest
#     docker tag  ghcr.nju.edu.cn/<owner>/fba-api:latest ghcr.io/<owner>/fba-api:latest
#     docker tag  ghcr.nju.edu.cn/<owner>/fba-web:latest ghcr.io/<owner>/fba-web:latest
#     docker compose -f docker-compose.prod.yml up -d   # 本地已有同名镜像，不会再去拉
#
#   这类加速器不是官方服务，可用性会变化，卡住时换一个镜像加速域名重试即可，
#   原理都一样（对外暴露一份 `ghcr.io` 内容的镜像）。
#
# 【本地 / 离线场景】不想依赖 GHCR，直接在当前机器上从源码构建：
#
#     docker compose -f docker-compose.prod.yml build
#     docker compose -f docker-compose.prod.yml up -d
#
# 与 apps/api/docker-compose.yml 的关系：那份是**上游的**（主库 PostgreSQL、
# broker RabbitMQ、挂的还是已废弃的 static/upload 路径），照它起不来。
#
# ⚠️ 走本地构建这条路时，先确认 **docker daemon 自己**够得着镜像仓库。它不读
# shell 的 http_proxy —— 本机实测：curl 拿得到 ghcr.io，`docker build` 却
# i/o timeout，报错指向 Dockerfile 的 FROM 行，看起来像镜像名写错了。要在
# WSL / 代理环境里构建，给 daemon 单独配一次：
#
#     sudo mkdir -p /etc/systemd/system/docker.service.d
#     sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf <<'EOF'
#     [Service]
#     Environment="HTTP_PROXY=http://<代理>:<端口>"
#     Environment="HTTPS_PROXY=http://<代理>:<端口>"
#     Environment="NO_PROXY=localhost,127.0.0.1"
#     EOF
#     sudo systemctl daemon-reload && sudo systemctl restart docker
#
# 🔴 **SQL Server 和 Redis 都不进这份编排**，各自独立部署、独立运维：
#   1. `docker compose down -v` 一条命令就能把生产数据（DB + 缓存）一起抹掉
#   2. SQL Server 官方镜像默认 sa 账号，Developer 版授权只允许开发/测试用途；
#      Redis 同理——测试用的 `redis:7-alpine` 直接进生产编排没有密码轮换、
#      持久化策略、内存上限这些运维手段，跟着应用容器一起被 `down` 掉更不划算
#   3. 应用容器无状态才能滚动重启；有状态服务混进来会逼着每次发版都碰数据库/缓存
# 这份编排只剩**无状态**的应用容器：api / worker / beat / web，外加一次性的
# migrate。`.env.server` 里的 `DATABASE_*` / `REDIS_*` 指向哪，它们就连哪 ——
# 跟这份文件在不在同一台机器、用不用容器，这份编排完全不关心。
#
# ⚠️ 如果 SQL Server / Redis 就跑在**这台宿主机**上、但不在 Docker 里（比如宝塔
# 面板自带的 Redis/MySQL 管理），容器默认桥接网络连不到宿主机的 `127.0.0.1` ——
# 那是容器自己的回环地址，不是宿主机的。`.env.server` 里的 `DATABASE_HOST` /
# `REDIS_HOST` 要填宿主机在 docker 网桥上的地址（一般是 `172.17.0.1`，
# `ip addr show docker0` 能查到），或者给下面的服务加
# `extra_hosts: ["host.docker.internal:host-gateway"]` 再填
# `host.docker.internal`。直接填 `127.0.0.1`/`localhost` 是最常见的踩坑，
# 表现是 API 容器起来了、健康检查却一直连不上数据库/Redis。

name: fastapi-react-admin

x-api-base: &api-base
  # IMAGE_OWNER 默认是这个仓库自己（fork 出去部署时改一下就行，不用碰别的地方）；
  # TAG 默认 latest，回滚时设成某个 sha-<短 SHA>，见文件顶部注释。
  image: ghcr.io/${IMAGE_OWNER:-yilecoding}/fba-api:${TAG:-latest}
  build:
    context: ./apps/api
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  environment:
    TZ: Asia/Shanghai
  # 挂成容器里的 backend/.env。⚠️ 缺这个文件时应用会**拒绝启动**而不是
  # 自动拷示例（conf.py: _ensure_env_file 检测到 /.dockerenv 即视为生产形态）
  volumes:
    - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
    - fba_upload:/app/backend/upload
    - fba_upload_public:/app/backend/upload-public
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # 跑一次性的 schema 迁移，跑完才允许 API 接流量。
  # 部署前先备份外部 SQL Server；Alembic 没有自动回滚。
  migrate:
    <<: *api-base
    restart: "no"
    command:
      - sh
      - -c
      - cd /app/backend && alembic upgrade head
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro

  api:
    <<: *api-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
      - fba_upload:/app/backend/upload
      - fba_upload_public:/app/backend/upload-public
      - fba_log_api:/app/backend/log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      # prod 启动时要校验 alembic 版本 + 扫种子密码，给足时间
      start_period: 90s

  worker:
    <<: *api-base
    # 可以多副本：`docker compose up -d --scale worker=3`，所以刻意不设 container_name
    command:
      - celery
      - -A
      - backend.app.task.celery
      - worker
      - -l
      - info
      - --pool=custom
    environment:
      TZ: Asia/Shanghai
      CELERY_CUSTOM_WORKER_POOL: celery_aio_pool.pool:AsyncIOPool
    # 🔴 之前漏挂了这条——worker 没等 migrate 跑完就可能先起来，
    # 拿旧表结构处理任务。api 已经在挡这个坑（depends_on migrate），
    # worker 会碰数据库的路径和 api 一样多，没道理不用同一条闸门。
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
      - fba_upload:/app/backend/upload
      - fba_upload_public:/app/backend/upload-public
      - fba_log_worker:/app/backend/log
    # 🔴 `celery inspect ping` 会整个另起一个 Python 进程去连 broker 一趟——
    # 单独手动跑很快（实测稳定 2s 内），但作为**每 30s 跑一次的健康检查**，
    # 在内存吃紧、swap 跑满的机器上（这台生产机常年如此）反复冷启动一个新进程
    # 本身就会跟其它容器抢内存，实测加了 --timeout=10 之后自动检查依然
    # 大概率超时（单次耗时涨到 ~12s，`docker inspect` 的健康检查历史里连续
    # 好几条 `No nodes replied within time constraint`），换成更宽的超时只是
    # 把这台机器的资源问题伪装成「等久一点就好」。
    # 改成跟 beat 同一套思路：只证明进程没死，不去证明它真的响应了一次完整的
    # broker 往返——worker 是容器 PID 1，没有 shell 包一层，直接读
    # /proc/1/cmdline，零额外进程、零额外内存
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  beat:
    <<: *api-base
    # 🔴 **只能一个副本。** 多个 beat = 同一条调度被触发 N 次（根 CLAUDE.md）。
    # container_name 在这里是**故意**写的 —— 它会让 `--scale beat=2` 直接失败，
    # 而不是安静地起两个
    container_name: fba_beat
    command:
      - celery
      - -A
      - backend.app.task.celery
      - beat
      - -l
      - info
    depends_on:
      # 等 api 把 task_scheduler 表准备好
      api:
        condition: service_healthy
    volumes:
      - ./apps/api/deploy/backend/docker-compose/.env.server:/app/backend/.env:ro
      - fba_log_beat:/app/backend/log
    # 🔴 镜像基于 Debian slim，没装 procps——`pgrep` 是「命令不存在」（exit 127），
    # 不是「没找到进程」，健康检查因此永远失败，即便 beat 跑得好好的。
    # beat 进程就是容器的 PID 1（没有 shell 包一层），直接读 /proc/1/cmdline，
    # 不用依赖额外装的工具
    healthcheck:
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${IMAGE_OWNER:-yilecoding}/fba-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 空串 = 同源相对路径，由 nginx 反代到 api。见 apps/web/Dockerfile 的说明
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      # TLS 建议交给上游 LB / Caddy / 宝塔的反代，这里只出 80
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  # 私有附件 —— 只能经 /api/v1/sys/files/{pk}/download 读
  fba_upload:
  # 富文本内联图 —— 经 /uploads 无鉴权读，两棵树不能合并
  fba_upload_public:
  fba_log_api:
  fba_log_worker:
  fba_log_beat:

# 生产编排 —— 唯一一份。服务器上跑的必须是这份文件的**逐字节副本**：本机差异
# 全部走 compose 同级的 `.env`（`FBA_WEB_PORT` / `FBA_ENV_FILE` / `FBA_PULL_MIRROR`），
# 不要在服务器上手改这个文件。为什么会有这条纪律，见 deploy/AGENTS.md
# 「服务器上那份 compose 是手抄的」。
#
# 部署命令一律走 deploy/prod.sh —— 服务器上跑的是同一个脚本，它刻意不依赖仓库：
#
#     bash deploy/prod.sh pull     # 拉 CI 推到 GHCR 的镜像（可走加速器，自动 retag）
#     bash deploy/prod.sh up       # 先 migrate，成功了才起 api/worker/beat/web
#     bash deploy/prod.sh status   # 在跑的是哪个提交、和 main 差多少
#     bash deploy/prod.sh sync     # 服务器上更新这份 compose 的唯一正确姿势
#
# 回滚不用等一次新构建 —— 除了 latest 还有 sha-<短 SHA> 和 sha-<完整 SHA> 两种标签：
#
#     TAG=sha-abc1234 bash deploy/prod.sh pull
#     TAG=sha-abc1234 bash deploy/prod.sh up
#
# 【本地 / 离线场景】不想依赖 GHCR，直接在当前机器上从源码构建。和上面二选一，
# 不要混用，否则 up 跑的到底是哪次构建，取决于谁最后碰过本地镜像缓存：
#
#     docker compose -f docker-compose.prod.yml build
#     bash deploy/prod.sh up
#
# 与 apps/api/docker-compose.yml 的关系：那份是**上游的**（主库 PostgreSQL、
# broker RabbitMQ、挂的还是已废弃的 static/upload 路径），照它起不来。
#
# 🔴 **SQL Server 和 Redis 都不进这份编排**，各自独立部署、独立运维：
#   1. `docker compose down -v` 一条命令就能把生产数据（DB + 缓存）一起抹掉
#   2. SQL Server 官方镜像默认 sa 账号，Developer 版授权只允许开发/测试用途；
#      Redis 同理——测试用的 `redis:7-alpine` 直接进生产编排没有密码轮换、
#      持久化策略、内存上限这些运维手段，跟着应用容器一起被 `down` 掉更不划算
#   3. 应用容器无状态才能滚动重启；有状态服务混进来会逼着每次发版都碰数据库/缓存
# 这份编排只剩**无状态**的应用容器：api / worker / beat / web，外加一次性的
# migrate。`.env.server` 里的 `DATABASE_*` / `REDIS_*` 指向哪，它们就连哪 ——
# 跟这份文件在不在同一台机器、用不用容器，这份编排完全不关心。
#
# 其余踩坑（GHCR 国内限速要走加速器 / `.env.server` 属主必须匹配容器 uid /
# 容器连宿主机不能填 127.0.0.1 / docker daemon 不读 shell 的 http_proxy）
# 都在 deploy/AGENTS.md —— 那份按目录自动加载，别在这里再抄一份。

name: fastapi-react-admin

x-api-base: &api-base
  # IMAGE_OWNER 默认是这个仓库自己（fork 出去部署时改一下就行，不用碰别的地方）；
  # TAG 默认 latest，回滚时设成某个 sha-<短 SHA>，见文件顶部注释。
  # 这两个连同 FBA_* 都从 compose 同级的 .env 读，服务器上只改那一份。
  image: ghcr.io/${IMAGE_OWNER:-yilecoding}/fba-api:${TAG:-latest}
  build:
    context: ./apps/api
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  environment:
    TZ: Asia/Shanghai
  # 挂成容器里的 backend/.env。⚠️ 缺这个文件时应用会**拒绝启动**而不是
  # 自动拷示例（conf.py: _ensure_env_file 检测到 /.dockerenv 即视为生产形态）
  volumes:
    - "${FBA_ENV_FILE:-./apps/api/deploy/backend/docker-compose/.env.server}:/app/backend/.env:ro"
    - fba_upload:/app/backend/upload
    - fba_upload_public:/app/backend/upload-public
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # 跑一次性的 schema 迁移，跑完才允许 API 接流量。
  # 部署前先备份外部 SQL Server；Alembic 没有自动回滚。
  migrate:
    <<: *api-base
    restart: "no"
    command:
      - sh
      - -c
      - cd /app/backend && alembic upgrade head
    volumes:
      - "${FBA_ENV_FILE:-./apps/api/deploy/backend/docker-compose/.env.server}:/app/backend/.env:ro"

  api:
    <<: *api-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - "${FBA_ENV_FILE:-./apps/api/deploy/backend/docker-compose/.env.server}:/app/backend/.env:ro"
      - fba_upload:/app/backend/upload
      - fba_upload_public:/app/backend/upload-public
      - fba_log_api:/app/backend/log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      # prod 启动时要校验 alembic 版本 + 扫种子密码，给足时间
      start_period: 90s

  worker:
    <<: *api-base
    # 可以多副本：`docker compose up -d --scale worker=3`，所以刻意不设 container_name
    command:
      - celery
      - -A
      - backend.app.task.celery
      - worker
      - -l
      - info
      - --pool=custom
    environment:
      TZ: Asia/Shanghai
      CELERY_CUSTOM_WORKER_POOL: celery_aio_pool.pool:AsyncIOPool
    # 🔴 之前漏挂了这条——worker 没等 migrate 跑完就可能先起来，
    # 拿旧表结构处理任务。api 已经在挡这个坑（depends_on migrate），
    # worker 会碰数据库的路径和 api 一样多，没道理不用同一条闸门。
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - "${FBA_ENV_FILE:-./apps/api/deploy/backend/docker-compose/.env.server}:/app/backend/.env:ro"
      - fba_upload:/app/backend/upload
      - fba_upload_public:/app/backend/upload-public
      - fba_log_worker:/app/backend/log
    # 🔴 `celery inspect ping` 会整个另起一个 Python 进程去连 broker 一趟——
    # 单独手动跑很快（实测稳定 2s 内），但作为**每 30s 跑一次的健康检查**，
    # 在内存吃紧、swap 跑满的机器上（这台生产机常年如此）反复冷启动一个新进程
    # 本身就会跟其它容器抢内存，实测加了 --timeout=10 之后自动检查依然
    # 大概率超时（单次耗时涨到 ~12s，`docker inspect` 的健康检查历史里连续
    # 好几条 `No nodes replied within time constraint`），换成更宽的超时只是
    # 把这台机器的资源问题伪装成「等久一点就好」。
    # 改成跟 beat 同一套思路：只证明进程没死，不去证明它真的响应了一次完整的
    # broker 往返——worker 是容器 PID 1，没有 shell 包一层，直接读
    # /proc/1/cmdline，零额外进程、零额外内存
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  beat:
    <<: *api-base
    # 🔴 **只能一个副本。** 多个 beat = 同一条调度被触发 N 次（根 CLAUDE.md）。
    # container_name 在这里是**故意**写的 —— 它会让 `--scale beat=2` 直接失败，
    # 而不是安静地起两个
    container_name: fba_beat
    command:
      - celery
      - -A
      - backend.app.task.celery
      - beat
      - -l
      - info
    depends_on:
      # 等 api 把 task_scheduler 表准备好
      api:
        condition: service_healthy
    volumes:
      - "${FBA_ENV_FILE:-./apps/api/deploy/backend/docker-compose/.env.server}:/app/backend/.env:ro"
      - fba_log_beat:/app/backend/log
    # 🔴 镜像基于 Debian slim，没装 procps——`pgrep` 是「命令不存在」（exit 127），
    # 不是「没找到进程」，健康检查因此永远失败，即便 beat 跑得好好的。
    # beat 进程就是容器的 PID 1（没有 shell 包一层），直接读 /proc/1/cmdline，
    # 不用依赖额外装的工具
    healthcheck:
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${IMAGE_OWNER:-yilecoding}/fba-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 空串 = 同源相对路径，由 nginx 反代到 api。见 apps/web/Dockerfile 的说明
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      # TLS 建议交给上游 LB / Caddy / 宝塔的反代，这里只出一个明文端口。
      # 宿主机 80 被别的东西占着（宝塔 nginx 就是），在 .env 里写
      # FBA_WEB_PORT=8080，不要改这一行 —— 改了服务器就和仓库分叉了
      - "${FBA_WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  # 私有附件 —— 只能经 /api/v1/sys/files/{pk}/download 读
  fba_upload:
  # 富文本内联图 —— 经 /uploads 无鉴权读，两棵树不能合并
  fba_upload_public:
  fba_log_api:
  fba_log_worker:
  fba_log_beat:
